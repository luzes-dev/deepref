[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is transitive through biblatex and utoipa-axum; no safe upgrade is available" },
  { id = "RUSTSEC-2023-0071", reason = "rsa is pulled in by jsonwebtoken's rust_crypto backend, which only verifies WorkOS RS256 signatures with public keys; the Marvin timing leak affects private-key operations and no patch exists" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint is transitive through jsonwebtoken's rust_crypto backend (via p256/p384), which only verifies WorkOS signatures with public keys; timing leak affects private-key operations and no non-breaking patch exists" },
]

[licenses]
allow = [
	"0BSD",
	"Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
	"MIT",
	"MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
