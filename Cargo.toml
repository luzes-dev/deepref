[workspace]
members = [
    "tools/xtask",
    "crates/domain",
    "crates/application",
    "crates/documents",
    "crates/postgres",
    "crates/http-api",
    "crates/config",
    "crates/core",
    "crates/crossref",
    "crates/providers",
    "crates/events",
    "crates/graph",
    "crates/telemetry",
    "crates/ai",
    "crates/review",
    "apps/server",
    "services/worker",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
deepref-domain = { path = "crates/domain" }
deepref-application = { path = "crates/application" }
deepref-documents = { path = "crates/documents" }
deepref-postgres = { path = "crates/postgres" }
deepref-http-api = { path = "crates/http-api" }
deepref-core = { path = "crates/core" }
deepref-config = { path = "crates/config" }
deepref-crossref = { path = "crates/crossref" }
deepref-providers = { path = "crates/providers" }
deepref-events = { path = "crates/events" }
deepref-graph = { path = "crates/graph" }
deepref-telemetry = { path = "crates/telemetry" }
deepref-ai = { path = "crates/ai" }
deepref-review = { path = "crates/review" }
anyhow = "1.0.103"
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.32.0", features = ["rt-tokio"] }
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.10.1"
backoff = { version = "0.4", features = ["tokio"] }
biblatex = "0.12.0"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
futures = "0.3.32"
garde = { version = "0.22.0", features = ["derive"] }
jsonschema = "0.49.0"
rig-core = "0.36.0"
pgvector = { version = "0.4.0", features = ["sqlx"] }
petgraph = "0.8.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "gzip", "brotli"] }
rapidfuzz = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = { version = "1.2.1", features = ["uuid1"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33.0"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2.0"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.23.4", features = ["serde", "v4", "v5"] }
unicode-normalization = "0.1.24"
unicode_categories = "0.1.1"
object_store = { version = "0.14.0", features = ["aws", "fs"] }
pdfium-render = { version = "0.9.0", default-features = false, features = ["pdfium_latest", "thread_safe"] }
wiremock = "0.6.5"
