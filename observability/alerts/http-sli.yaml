groups:
  - name: deepref-http-sli
    interval: 30s
    rules:
      - alert: DeepRefCoreApiUnavailable
        expr: sum(up{job="deepref-api"}) < 1
        for: 2m
        labels: {severity: critical, service: api, sli: core}
        annotations: {summary: "No healthy core API target", runbook: "docs/operations/runbooks/break-glass-access.md"}
      - alert: DeepRefCoreHigh5xxRatio
        expr: sum(rate(deepref_http_requests_total{service="api",route!~"/health.*",status=~"5.."}[10m])) / clamp_min(sum(rate(deepref_http_requests_total{service="api",route!~"/health.*"}[10m])), 0.001) > 0.05
        for: 10m
        labels: {severity: critical, service: api, sli: core}
        annotations: {summary: "Core API 5xx ratio exceeds the provisional 5% symptom threshold", note: "This is not the undefined 99.9% error-budget policy."}
      - alert: DeepRefCoreLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(deepref_http_request_duration_seconds_bucket{service="api",route!~"/health.*"}[10m]))) > 2
        for: 15m
        labels: {severity: warning, service: api, sli: core}
        annotations: {summary: "Core API p95 latency exceeds the provisional two-second threshold"}
      - alert: DeepRefGraphRouteErrors
        expr: sum(rate(deepref_http_requests_total{service="api",route=~".*(graph|recommendations).*",status=~"5.."}[10m])) > 0.1
        for: 10m
        labels: {severity: warning, service: api, sli: graph}
        annotations: {summary: "Graph-only routes are returning server errors"}
      - alert: DeepRefHttpTrafficMetricsAbsent
        expr: absent(deepref_http_requests_total{service="api"})
        for: 10m
        labels: {severity: critical, service: telemetry}
        annotations: {summary: "Required API request metric is absent"}
      - alert: DeepRefHttpLatencyMetricsAbsent
        expr: absent(deepref_http_request_duration_seconds_bucket{service="api"})
        for: 10m
        labels: {severity: critical, service: telemetry}
        annotations: {summary: "Required API latency histogram is absent"}
