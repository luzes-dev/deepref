groups:
  - name: deepref-projection-neo4j
    interval: 30s
    rules:
      - alert: DeepRefNeo4jUnavailable
        expr: sum(up{job="neo4j"}) < 1
        for: 3m
        labels: {severity: warning, service: neo4j, sli: graph}
        annotations: {summary: "Neo4j graph read model is unavailable", runbook: "docs/operations/runbooks/neo4j-rebuild.md"}
      - alert: DeepRefProjectionLagHigh
        expr: max(deepref_projection_lag_seconds) > 300
        for: 10m
        labels: {severity: warning, service: projector}
        annotations: {summary: "Projection lag exceeds the provisional five-minute threshold", runbook: "docs/operations/runbooks/projection-lag.md"}
      - alert: DeepRefProjectionFailures
        expr: sum(increase(deepref_projection_failures_total[10m])) > 0
        labels: {severity: critical, service: projector}
        annotations: {summary: "Projector reported a projection failure"}
      - alert: DeepRefProjectionRebuildStalled
        expr: max(deepref_projection_rebuild_in_progress) == 1 and max(deepref_projection_rebuild_elapsed_seconds) > 3600
        for: 5m
        labels: {severity: critical, service: projector}
        annotations: {summary: "Graph rebuild exceeded the one-hour acceptance target"}
      - alert: DeepRefProjectionMetricsAbsent
        expr: absent(deepref_projection_lag_seconds) or absent(deepref_projection_failures_total)
        for: 10m
        labels: {severity: critical, service: telemetry}
        annotations: {summary: "Required projection metrics are absent"}
