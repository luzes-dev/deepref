groups:
  - name: deepref-nats-worker
    interval: 30s
    rules:
      - alert: DeepRefNatsQuorumAtRisk
        expr: nats_jetstream_cluster_replicas{stream=~"DEEPREF_(WORK|DOMAIN|DLQ)"} < 3 and on(environment) deepref_environment_info{environment=~"staging|production"} == 1
        for: 2m
        labels: {severity: critical, service: nats}
        annotations: {summary: "A hosted JetStream stream has fewer than three replicas", runbook: "docs/operations/runbooks/nats-quorum-dlq-recovery.md"}
      - alert: DeepRefWorkerConsumerLag
        expr: nats_jetstream_consumer_num_pending{consumer="deepref-worker"} > 1000
        for: 10m
        labels: {severity: warning, service: worker}
        annotations: {summary: "Worker durable consumer pending count is high"}
      - alert: DeepRefDlqDepth
        expr: nats_jetstream_stream_messages{stream="DEEPREF_DLQ"} > 0
        for: 5m
        labels: {severity: critical, service: worker}
        annotations: {summary: "Dead-letter stream contains events", runbook: "docs/operations/runbooks/nats-quorum-dlq-recovery.md"}
      - alert: DeepRefWorkerRetrySpike
        expr: sum(rate(deepref_worker_delivery_retries_total[10m])) > 1
        for: 10m
        labels: {severity: warning, service: worker}
        annotations: {summary: "Worker delivery retries are elevated"}
      - alert: DeepRefWorkerLeaseRecoverySpike
        expr: sum(increase(deepref_worker_lease_recoveries_total[15m])) > 10
        labels: {severity: warning, service: worker}
        annotations: {summary: "Worker is recovering an unusual number of expired leases"}
      - alert: DeepRefNatsWorkerMetricsAbsent
        expr: absent(nats_jetstream_consumer_num_pending{consumer="deepref-worker"}) or absent(deepref_worker_delivery_retries_total)
        for: 10m
        labels: {severity: critical, service: telemetry}
        annotations: {summary: "Required NATS or worker metrics are absent"}
