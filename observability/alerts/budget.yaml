groups:
  - name: deepref-budgets
    interval: 5m
    rules:
      - alert: DeepRefMonthlyBudgetForecastExceeded
        expr: deepref_aws_budget_forecast_ratio > 1
        for: 15m
        labels: {severity: warning, service: finance}
        annotations: {summary: "AWS forecast exceeds the configured monthly budget"}
      - alert: DeepRefMonthlyBudgetActualHigh
        expr: deepref_aws_budget_actual_ratio > 0.8
        for: 15m
        labels: {severity: warning, service: finance}
        annotations: {summary: "AWS actual spend exceeds 80% of the configured monthly budget"}
      - alert: DeepRefCloudflareBudgetForecastExceeded
        expr: deepref_cloudflare_budget_forecast_ratio > 1
        for: 15m
        labels: {severity: warning, service: finance}
        annotations: {summary: "Cloudflare forecast exceeds the configured monthly budget"}
      - alert: DeepRefBudgetMetricsAbsent
        expr: absent(deepref_aws_budget_forecast_ratio) or absent(deepref_aws_budget_actual_ratio)
        for: 6h
        labels: {severity: critical, service: telemetry}
        annotations: {summary: "Required budget metrics are absent"}
