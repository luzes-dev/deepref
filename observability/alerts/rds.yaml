groups:
  - name: deepref-rds
    interval: 1m
    rules:
      - alert: DeepRefRdsCpuSaturation
        expr: aws_rds_cpuutilization_average{db_instance_identifier=~"deepref-.*"} > 80
        for: 15m
        labels: {severity: warning, service: postgresql}
        annotations: {summary: "RDS CPU exceeds the provisional 80% threshold"}
      - alert: DeepRefRdsLowFreeStorage
        expr: aws_rds_free_storage_space_average{db_instance_identifier=~"deepref-.*"} < 10737418240
        for: 10m
        labels: {severity: critical, service: postgresql}
        annotations: {summary: "RDS has less than 10 GiB free storage"}
      - alert: DeepRefRdsConnectionPressure
        expr: aws_rds_database_connections_average{db_instance_identifier=~"deepref-.*"} > 160
        for: 10m
        labels: {severity: warning, service: postgresql}
        annotations: {summary: "RDS connection count exceeds the provisional threshold"}
      - alert: DeepRefRdsReplicaOrFailoverEvent
        expr: increase(deepref_rds_failover_events_total[15m]) > 0
        labels: {severity: critical, service: postgresql}
        annotations: {summary: "RDS failover event detected", runbook: "docs/operations/runbooks/rds-failover-pitr.md"}
      - alert: DeepRefRdsMetricsAbsent
        expr: absent(aws_rds_cpuutilization_average{db_instance_identifier=~"deepref-.*"})
        for: 15m
        labels: {severity: critical, service: telemetry}
        annotations: {summary: "Required RDS exporter metrics are absent"}
