groups:
  - name: deepref-kubernetes-tunnel
    interval: 30s
    rules:
      - alert: DeepRefKubernetesWorkloadUnavailable
        expr: kube_deployment_status_replicas_available{namespace="deepref",deployment=~"deepref-(api|worker|web)"} < 1
        for: 5m
        labels: {severity: critical, service: kubernetes}
        annotations: {summary: "A DeepRef deployment has no available replica"}
      - alert: DeepRefPodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{namespace="deepref",reason="CrashLoopBackOff"}[10m]) > 0
        for: 10m
        labels: {severity: warning, service: kubernetes}
        annotations: {summary: "A DeepRef pod is crash-looping"}
      - alert: DeepRefTunnelReplicaShortfall
        expr: kube_deployment_status_replicas_available{namespace="deepref",deployment="cloudflared"} < 1 or (kube_deployment_status_replicas_available{namespace="deepref",deployment="cloudflared"} < 2 and on(environment) deepref_environment_info{environment=~"staging|production"} == 1)
        for: 5m
        labels: {severity: critical, service: cloudflare}
        annotations: {summary: "Cloudflare Tunnel replica count is below the environment contract", runbook: "docs/operations/runbooks/cloudflare-or-idp-outage.md"}
      - alert: DeepRefCertificateExpiryNear
        expr: probe_ssl_earliest_cert_expiry{job="deepref-perimeter"} - time() < 1209600
        for: 10m
        labels: {severity: warning, service: cloudflare}
        annotations: {summary: "Perimeter certificate expires within 14 days"}
      - alert: DeepRefPlatformMetricsAbsent
        expr: absent(kube_deployment_status_replicas_available{namespace="deepref"}) or absent(probe_ssl_earliest_cert_expiry{job="deepref-perimeter"})
        for: 15m
        labels: {severity: critical, service: telemetry}
        annotations: {summary: "Required Kubernetes or perimeter probe metrics are absent"}
