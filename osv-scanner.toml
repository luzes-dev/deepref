[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
# rsa 0.9.10 is transitive through jsonwebtoken 10.3.0. The production WorkOS
# adapter only verifies RS256 signatures using public JWKs; the only signing
# call is in workos_identity.rs using a committed, non-secret test fixture.
# The Marvin timing leak affects private-key operations; no patch exists.
# Keep this accepted risk aligned with deny.toml.
reason = "rsa 0.9.10 via jsonwebtoken 10.3.0 only verifies public-key WorkOS RS256 signatures in production; private-key signing is confined to a public test fixture; no patch exists for the private-key timing leak"
ignoreUntil = 2027-10-20
