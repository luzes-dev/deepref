packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  msw: true
  # Rete ships prebuilt artifacts; its postinstall only prints a banner.
  rete: false
  svelte-preprocess: false

overrides:
  # Keep security-patched transitive pins aligned with the dependency audit.
  cookie: ^0.7.2
  brace-expansion: 5.0.9
  js-yaml: 4.3.2
  linkify-it: 5.0.2
  fast-uri: 3.1.6
  postcss: 8.5.23
  qs: '>=6.16.0'
  uuid: ^11.1.1
  devalue: '>=5.9.2'

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.101.1'
  - '@tanstack/svelte-query@6.1.35'
