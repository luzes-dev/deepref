packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  msw: true
  # Rete ships prebuilt artifacts; its postinstall only prints a banner.
  rete: false
  svelte-preprocess: false

overrides:
  # Keep security-patched transitive overrides aligned with the dependency audit.
  cookie: ^0.7.2
  '@sveltejs/kit>cookie': ^2.0.1
  'msw>cookie': ^2.0.1
  brace-expansion: ^5.0.11
  js-yaml: 4.3.2
  linkify-it: ^6.1.0
  markdown-it: ^15.0.2
  fast-uri: ^3.1.7
  postcss: 8.5.23
  qs: '>=6.16.0'
  uuid: ^11.1.1
  devalue: ^5.9.3
  source-map-js: ^1.2.2

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.101.1'
  - '@tanstack/svelte-query@6.1.35'

patchedDependencies:
  '@tanstack/svelte-store@0.12.2': patches/@tanstack__svelte-store@0.12.2.patch
