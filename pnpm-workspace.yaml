packages:
  - apps/*

onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
  msw: true

overrides:
  # Keep security-patched transitive pins aligned with the dependency audit.
  cookie: ^0.7.2
  brace-expansion: 5.0.9
  js-yaml: 4.3.1
  linkify-it: 5.0.2
  fast-uri: 3.1.6
  postcss: 8.5.23
  qs: '>=6.16.0'

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.101.1'
  - '@tanstack/svelte-query@6.1.35'
