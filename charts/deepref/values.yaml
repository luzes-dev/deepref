global:
  environment: development
  clusterDomain: cluster.local
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  podLabels: {}

namespace:
  create: true
  name: ""

images:
  api:
    repository: ""
    digest: ""
  worker:
    repository: ""
    digest: ""
  projector:
    repository: ""
    digest: ""
  web:
    repository: ""
    digest: ""
  nats:
    repository: docker.io/library/nats
    digest: sha256:ddb480f4b97d90f183123e96bbc7c96ab2a126883f7a380531cc208fc8ba9ca7
  natsBox:
    repository: docker.io/natsio/nats-box
    digest: sha256:abdc9f9f0120bb8adfbf674eb037d1551db55356eb198b7bd4ffed377f6950a6
  neo4j:
    repository: docker.io/library/neo4j
    digest: sha256:ff5de78d1e953427df7a8e1782aa18a5680ea8127c2d39649298319db2d6ea6a
  cloudflared:
    repository: docker.io/cloudflare/cloudflared
    digest: sha256:6d91c121b803126f7a5344005d17a9324788fc09d305b6e2560ec6040a7ae283
  adot:
    repository: docker.io/amazon/aws-otel-collector
    digest: sha256:8aa9ea5f67b8d318f7d6af24677e3c70f7098bc0631147cb5fa91addbe980b06

serviceAccounts:
  api: deepref-api
  worker: deepref-worker
  projector: deepref-projector
  web: deepref-web
  nats: deepref-nats
  natsAdmin: deepref-nats-admin
  neo4j: deepref-neo4j
  cloudflared: deepref-cloudflared
  adot: deepref-adot

runtime:
  database:
    poolMin: 2
    poolMax: 20
    acquireTimeoutSeconds: 10
    idleTimeoutSeconds: 600
    maxLifetimeSeconds: 1800
  nats:
    connectTimeoutSeconds: 5
    requestTimeoutSeconds: 10
  neo4j:
    poolMax: 16
    connectTimeoutSeconds: 5
    queryTimeoutSeconds: 15
  shutdownDeadlineSeconds: 30

api:
  replicas: 2
  corsOrigins: []
  graphRetryAfterSeconds: 30
  terminationGracePeriodSeconds: 45
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

worker:
  replicas: 2
  concurrency: 8
  claimLeaseSeconds: 60
  reconcilerIntervalSeconds: 30
  terminationGracePeriodSeconds: 60
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}

projector:
  replicas: 2
  batchSize: 1000
  terminationGracePeriodSeconds: 60
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}

web:
  replicas: 2
  terminationGracePeriodSeconds: 30
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

migration:
  enabled: true
  activeDeadlineSeconds: 900
  backoffLimit: 0
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

rebuild:
  enabled: false
  runId: ""
  activeDeadlineSeconds: 7200
  batchSize: 1000
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "4", memory: 4Gi}

nats:
  replicas: 1
  storage:
    size: 20Gi
    storageClassName: gp3-encrypted
  maxFileStore: 16Gi
  terminationGracePeriodSeconds: 60
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  bootstrap:
    activeDeadlineSeconds: 600
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

neo4j:
  storage:
    size: 50Gi
    storageClassName: gp3-encrypted
  pageCache: 1G
  heapInitial: 1G
  heapMax: 2G
  terminationGracePeriodSeconds: 120
  resources:
    requests: {cpu: 500m, memory: 3Gi}
    limits: {cpu: "4", memory: 6Gi}

cloudflared:
  replicas: 1
  terminationGracePeriodSeconds: 30
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

adot:
  replicas: 2
  awsRegion: sa-east-1
  prometheusRemoteWriteEndpoint: ""
  terminationGracePeriodSeconds: 30
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: deepref-secrets
    kind: ClusterSecretStore
  remote:
    database:
      key: deepref/development/database
      urlProperty: url
    neo4j:
      key: deepref/development/neo4j
      usernameProperty: username
      passwordProperty: password
      authProperty: auth
    nats:
      accountsKey: deepref/development/nats/accounts
      accountsProperty: accounts.conf
      tlsKey: deepref/development/nats/tls
      caProperty: ca.crt
      certificateProperty: tls.crt
      privateKeyProperty: tls.key
      apiCredentialsKey: deepref/development/nats/api
      workerCredentialsKey: deepref/development/nats/worker
      projectorCredentialsKey: deepref/development/nats/projector
      adminCredentialsKey: deepref/development/nats/admin
      credentialsProperty: credentials
    cloudflared:
      key: deepref/development/cloudflared
      tokenProperty: token

networkPolicy:
  enabled: true
  databaseEgress:
    cidrs: []
    port: 5432
  telemetryEgress:
    cidrs: []
    ports: [443]
  cloudflareEgress:
    cidrs: []
    ports: [443, 7844]

podDisruptionBudgets:
  enabled: true

imageVerification:
  enabled: true
  validationFailureAction: Enforce
  repositoryPatterns: []
  keyless:
    issuer: https://token.actions.githubusercontent.com
    subject: ""
