global:
  environment: development
  clusterDomain: cluster.local
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  podLabels: {}

namespace:
  create: true
  name: ""

images:
  api:
    repository: ""
    digest: ""
  worker:
    repository: ""
    digest: ""
  web:
    repository: ""
    digest: ""
  cloudflared:
    repository: docker.io/cloudflare/cloudflared
    digest: sha256:6d91c121b803126f7a5344005d17a9324788fc09d305b6e2560ec6040a7ae283
  adot:
    repository: docker.io/amazon/aws-otel-collector
    digest: sha256:8aa9ea5f67b8d318f7d6af24677e3c70f7098bc0631147cb5fa91addbe980b06

serviceAccounts:
  api: deepref-api
  worker: deepref-worker
  web: deepref-web
  cloudflared: deepref-cloudflared
  adot: deepref-adot

runtime:
  database:
    poolMin: 2
    poolMax: 20
    acquireTimeoutSeconds: 10
    idleTimeoutSeconds: 600
    maxLifetimeSeconds: 1800
  shutdownDeadlineSeconds: 30

api:
  replicas: 2
  corsOrigins: []
  terminationGracePeriodSeconds: 45
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

worker:
  replicas: 2
  concurrency: 8
  claimLeaseSeconds: 60
  reconcilerIntervalSeconds: 30
  terminationGracePeriodSeconds: 60
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}

web:
  replicas: 2
  terminationGracePeriodSeconds: 30
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

migration:
  enabled: true
  activeDeadlineSeconds: 900
  backoffLimit: 0
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

cloudflared:
  replicas: 1
  terminationGracePeriodSeconds: 30
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

adot:
  replicas: 2
  awsRegion: sa-east-1
  prometheusRemoteWriteEndpoint: ""
  terminationGracePeriodSeconds: 30
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: deepref-secrets
    kind: ClusterSecretStore
  remote:
    database:
      key: deepref/development/database
      urlProperty: url
    cloudflared:
      key: deepref/development/cloudflared
      tokenProperty: token

networkPolicy:
  enabled: true
  databaseEgress:
    cidrs: []
    port: 5432
  telemetryEgress:
    cidrs: []
    ports: [443]
  cloudflareEgress:
    cidrs: []
    ports: [443, 7844]

podDisruptionBudgets:
  enabled: true

imageVerification:
  enabled: true
  validationFailureAction: Enforce
  repositoryPatterns: []
  keyless:
    issuer: https://token.actions.githubusercontent.com
    subject: ""
