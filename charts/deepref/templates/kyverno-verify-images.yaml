{{- if .Values.imageVerification.enabled }}
{{- $subject := required "imageVerification.keyless.subject is required when image verification is enabled" .Values.imageVerification.keyless.subject }}
{{- if eq (len .Values.imageVerification.repositoryPatterns) 0 }}{{ fail "imageVerification.repositoryPatterns must not be empty when image verification is enabled" }}{{- end }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ include "deepref.componentName" (dict "root" . "component" "verify-images") }}
  labels:
    {{- include "deepref.labels" . | nindent 4 }}
spec:
  admission: true
  background: true
  emitWarning: false
  failurePolicy: Fail
  validationFailureAction: {{ .Values.imageVerification.validationFailureAction }}
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-signed-immutable-images
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/part-of: deepref
      verifyImages:
        {{- range .Values.imageVerification.repositoryPatterns }}
        - imageReferences: [{{ . | quote }}]
          mutateDigest: false
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    issuer: {{ $.Values.imageVerification.keyless.issuer | quote }}
                    subject: {{ $subject | quote }}
                    rekor:
                      url: https://rekor.sigstore.dev
        {{- end }}
{{- end }}
