apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deepref.componentName" (dict "root" . "component" "worker") }}
  namespace: {{ include "deepref.namespace" . }}
  labels:
    {{- include "deepref.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "deepref.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deepref.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
        {{- with .Values.global.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.worker }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "deepref.podSecurityContext" . | nindent 8 }}
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      {{- include "deepref.imagePullSecrets" . | nindent 6 }}
      {{- include "deepref.topology" (dict "root" . "component" "worker") | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "deepref.image" (dict "name" "worker" "image" .Values.images.worker) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "deepref.containerSecurityContext" . | nindent 12 }}
            runAsUser: 65532
            runAsGroup: 65532
          env:
            {{- include "deepref.runtimeEnv" (dict "root" . "serviceName" "deepref-worker") | nindent 12 }}
            - {name: WORKER_CONCURRENCY, value: {{ .Values.worker.concurrency | quote }}}
            - {name: WORKER_CLAIM_LEASE_SECS, value: {{ .Values.worker.claimLeaseSeconds | quote }}}
            - {name: WORKER_RECONCILER_INTERVAL_SECS, value: {{ .Values.worker.reconcilerIntervalSeconds | quote }}}
          volumeMounts:
            {{- include "deepref.runtimeVolumeMounts" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            exec: {command: ["/bin/sh", "-c", "test -r /proc/1/status"]}
            periodSeconds: 15
            timeoutSeconds: 2
          readinessProbe:
            exec: {command: ["/bin/sh", "-c", "test -r /proc/1/status"]}
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        {{- include "deepref.runtimeVolumes" (dict "root" . "credential" "worker") | nindent 8 }}
