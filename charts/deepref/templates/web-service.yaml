apiVersion: v1
kind: Service
metadata:
  name: {{ include "deepref.componentName" (dict "root" . "component" "web") }}
  namespace: {{ include "deepref.namespace" . }}
  labels:
    {{- include "deepref.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "deepref.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
