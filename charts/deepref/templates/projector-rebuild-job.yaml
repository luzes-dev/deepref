{{- if .Values.rebuild.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "deepref.componentName" (dict "root" . "component" (printf "rebuild-%s" (substr 0 8 .Values.rebuild.runId))) }}
  namespace: {{ include "deepref.namespace" . }}
  labels:
    {{- include "deepref.labels" . | nindent 4 }}
    app.kubernetes.io/component: projector-rebuild
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.rebuild.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        {{- include "deepref.selectorLabels" (dict "root" . "component" "projector-rebuild") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccounts.projector }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.runtime.shutdownDeadlineSeconds }}
      securityContext:
        {{- include "deepref.podSecurityContext" . | nindent 8 }}
        fsGroup: 65532
      {{- include "deepref.imagePullSecrets" . | nindent 6 }}
      {{- include "deepref.topology" (dict "root" . "component" "projector-rebuild") | nindent 6 }}
      containers:
        - name: rebuild
          image: {{ include "deepref.image" (dict "name" "projector" "image" .Values.images.projector) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["rebuild", "--run-id", {{ required "rebuild.runId is required when rebuild is enabled" .Values.rebuild.runId | quote }}]
          securityContext:
            {{- include "deepref.containerSecurityContext" . | nindent 12 }}
            runAsUser: 65532
            runAsGroup: 65532
          env:
            {{- include "deepref.runtimeEnv" (dict "root" . "serviceName" "deepref-projector-rebuild") | nindent 12 }}
            - {name: PROJECTOR_BATCH_SIZE, value: {{ .Values.rebuild.batchSize | quote }}}
          volumeMounts:
            {{- include "deepref.runtimeVolumeMounts" . | nindent 12 }}
          resources: {{- toYaml .Values.rebuild.resources | nindent 12 }}
      volumes:
        {{- include "deepref.runtimeVolumes" (dict "root" . "credential" "projector") | nindent 8 }}
{{- end }}
