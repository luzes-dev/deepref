apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deepref.componentName" (dict "root" . "component" "cloudflared") }}
  namespace: {{ include "deepref.namespace" . }}
  labels:
    {{- include "deepref.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudflared
spec:
  replicas: {{ .Values.cloudflared.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "deepref.selectorLabels" (dict "root" . "component" "cloudflared") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deepref.selectorLabels" (dict "root" . "component" "cloudflared") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.cloudflared }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.cloudflared.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "deepref.podSecurityContext" . | nindent 8 }}
        fsGroup: 65532
      {{- include "deepref.imagePullSecrets" . | nindent 6 }}
      {{- include "deepref.topology" (dict "root" . "component" "cloudflared") | nindent 6 }}
      containers:
        - name: cloudflared
          image: {{ include "deepref.image" (dict "name" "cloudflared" "image" .Values.images.cloudflared) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /var/run/secrets/deepref/cloudflared/token
          securityContext:
            {{- include "deepref.containerSecurityContext" . | nindent 12 }}
            runAsUser: 65532
            runAsGroup: 65532
          ports:
            - {name: metrics, containerPort: 2000, protocol: TCP}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: token, mountPath: /var/run/secrets/deepref/cloudflared, readOnly: true}
          resources: {{- toYaml .Values.cloudflared.resources | nindent 12 }}
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 5
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - name: token
          secret:
            secretName: {{ include "deepref.componentName" (dict "root" . "component" "cloudflared") }}
            items: [{key: token, path: token}]
