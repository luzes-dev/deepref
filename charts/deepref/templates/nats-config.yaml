apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deepref.componentName" (dict "root" . "component" "nats-config") }}
  namespace: {{ include "deepref.namespace" . }}
  labels:
    {{- include "deepref.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
data:
  nats.conf: |
    server_name: $POD_NAME
    port: 4222
    http_port: 8222
    pid_file: /tmp/nats/nats.pid
    lame_duck_duration: 30s
    lame_duck_grace_period: 10s
    max_payload: 8MB

    include /etc/nats/accounts/accounts.conf

    tls {
      cert_file: /etc/nats/tls/tls.crt
      key_file: /etc/nats/tls/tls.key
      ca_file: /etc/nats/tls/ca.crt
      verify: false
      timeout: 2
    }

    jetstream {
      store_dir: /data/jetstream
      max_file_store: {{ .Values.nats.maxFileStore }}
    }

    cluster {
      name: deepref
      port: 6222
      routes = [
      {{- range $ordinal := until (int .Values.nats.replicas) }}
        nats-route://{{ include "deepref.componentName" (dict "root" $ "component" "nats") }}-{{ $ordinal }}.{{ include "deepref.componentName" (dict "root" $ "component" "nats-headless") }}.{{ include "deepref.namespace" $ }}.svc.{{ $.Values.global.clusterDomain }}:6222{{ if lt (add1 $ordinal) (int $.Values.nats.replicas) }},{{ end }}
      {{- end }}
      ]
      tls {
        cert_file: /etc/nats/tls/tls.crt
        key_file: /etc/nats/tls/tls.key
        ca_file: /etc/nats/tls/ca.crt
        verify: true
        timeout: 2
      }
    }
