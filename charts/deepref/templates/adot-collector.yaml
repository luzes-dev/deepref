apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deepref.componentName" (dict "root" . "component" "adot") }}
  namespace: {{ include "deepref.namespace" . }}
  labels:
    {{- include "deepref.labels" . | nindent 4 }}
    app.kubernetes.io/component: adot
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      sigv4auth:
        region: {{ .Values.adot.awsRegion }}
        service: aps
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_mib: 768
    exporters:
      awsxray:
        region: {{ .Values.adot.awsRegion }}
      {{- if .Values.adot.prometheusRemoteWriteEndpoint }}
      prometheusremotewrite:
        endpoint: {{ .Values.adot.prometheusRemoteWriteEndpoint }}
        auth:
          authenticator: sigv4auth
      {{- end }}
    service:
      extensions: [health_check{{ if .Values.adot.prometheusRemoteWriteEndpoint }}, sigv4auth{{ end }}]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [awsxray]
        {{- if .Values.adot.prometheusRemoteWriteEndpoint }}
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "deepref.componentName" (dict "root" . "component" "adot") }}
  namespace: {{ include "deepref.namespace" . }}
  labels:
    {{- include "deepref.labels" . | nindent 4 }}
    app.kubernetes.io/component: adot
spec:
  type: ClusterIP
  selector:
    {{- include "deepref.selectorLabels" (dict "root" . "component" "adot") | nindent 4 }}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deepref.componentName" (dict "root" . "component" "adot") }}
  namespace: {{ include "deepref.namespace" . }}
  labels:
    {{- include "deepref.labels" . | nindent 4 }}
    app.kubernetes.io/component: adot
spec:
  replicas: {{ .Values.adot.replicas }}
  selector:
    matchLabels:
      {{- include "deepref.selectorLabels" (dict "root" . "component" "adot") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deepref.selectorLabels" (dict "root" . "component" "adot") | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.adot | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.adot }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.adot.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "deepref.podSecurityContext" . | nindent 8 }}
        fsGroup: 1000
      {{- include "deepref.imagePullSecrets" . | nindent 6 }}
      {{- include "deepref.topology" (dict "root" . "component" "adot") | nindent 6 }}
      containers:
        - name: collector
          image: {{ include "deepref.image" (dict "name" "adot" "image" .Values.images.adot) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["--config=/etc/adot/collector.yaml"]
          securityContext:
            {{- include "deepref.containerSecurityContext" . | nindent 12 }}
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          volumeMounts:
            - {name: config, mountPath: /etc/adot, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          resources: {{- toYaml .Values.adot.resources | nindent 12 }}
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "deepref.componentName" (dict "root" . "component" "adot") }}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
