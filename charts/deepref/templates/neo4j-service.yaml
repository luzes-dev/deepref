apiVersion: v1
kind: Service
metadata:
  name: {{ include "deepref.componentName" (dict "root" . "component" "neo4j") }}
  namespace: {{ include "deepref.namespace" . }}
  labels:
    {{- include "deepref.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
spec:
  type: ClusterIP
  selector:
    {{- include "deepref.selectorLabels" (dict "root" . "component" "neo4j") | nindent 4 }}
  ports:
    - {name: http, port: 7474, targetPort: http}
    - {name: bolt, port: 7687, targetPort: bolt}
