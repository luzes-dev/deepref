apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "deepref.componentName" (dict "root" . "component" "neo4j") }}
  namespace: {{ include "deepref.namespace" . }}
  labels:
    {{- include "deepref.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  serviceName: {{ include "deepref.componentName" (dict "root" . "component" "neo4j") }}
  replicas: 1
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels:
      {{- include "deepref.selectorLabels" (dict "root" . "component" "neo4j") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deepref.selectorLabels" (dict "root" . "component" "neo4j") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.neo4j }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.neo4j.terminationGracePeriodSeconds }}
      nodeSelector:
        deepref.io/workload-class: stateful
      securityContext:
        {{- include "deepref.podSecurityContext" . | nindent 8 }}
        fsGroup: 7474
        fsGroupChangePolicy: OnRootMismatch
      {{- include "deepref.imagePullSecrets" . | nindent 6 }}
      {{- include "deepref.topology" (dict "root" . "component" "neo4j") | nindent 6 }}
      containers:
        - name: neo4j
          image: {{ include "deepref.image" (dict "name" "neo4j" "image" .Values.images.neo4j) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "deepref.containerSecurityContext" . | nindent 12 }}
            runAsUser: 7474
            runAsGroup: 7474
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "deepref.componentName" (dict "root" . "component" "neo4j-auth") }}
                  key: auth
            - {name: NEO4J_server_default__listen__address, value: "0.0.0.0"}
            - {name: NEO4J_server_memory_pagecache_size, value: {{ .Values.neo4j.pageCache | quote }}}
            - {name: NEO4J_server_memory_heap_initial__size, value: {{ .Values.neo4j.heapInitial | quote }}}
            - {name: NEO4J_server_memory_heap_max__size, value: {{ .Values.neo4j.heapMax | quote }}}
            - {name: NEO4J_CONF, value: /conf}
          ports:
            - {name: http, containerPort: 7474}
            - {name: bolt, containerPort: 7687}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: logs, mountPath: /logs}
            - {name: import, mountPath: /import}
            - {name: plugins, mountPath: /plugins}
            - {name: conf, mountPath: /conf}
            - {name: tmp, mountPath: /tmp}
          resources: {{- toYaml .Values.neo4j.resources | nindent 12 }}
          startupProbe:
            tcpSocket: {port: bolt}
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: bolt}
            periodSeconds: 15
          readinessProbe:
            tcpSocket: {port: bolt}
            periodSeconds: 5
      volumes:
        - {name: logs, emptyDir: {sizeLimit: 2Gi}}
        - {name: import, emptyDir: {sizeLimit: 4Gi}}
        - {name: plugins, emptyDir: {sizeLimit: 256Mi}}
        - {name: conf, emptyDir: {sizeLimit: 64Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "deepref.labels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.neo4j.storage.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.neo4j.storage.size }}
