{{- if .Values.externalSecrets.enabled }}
{{- $root := . }}
{{- $store := .Values.externalSecrets.secretStoreRef }}
{{- $refresh := .Values.externalSecrets.refreshInterval }}
{{- $secrets := list
  (dict "name" "database" "data" (list (dict "secretKey" "url" "key" .Values.externalSecrets.remote.database.key "property" .Values.externalSecrets.remote.database.urlProperty)))
  (dict "name" "neo4j-auth" "data" (list
    (dict "secretKey" "username" "key" .Values.externalSecrets.remote.neo4j.key "property" .Values.externalSecrets.remote.neo4j.usernameProperty)
    (dict "secretKey" "password" "key" .Values.externalSecrets.remote.neo4j.key "property" .Values.externalSecrets.remote.neo4j.passwordProperty)
    (dict "secretKey" "auth" "key" .Values.externalSecrets.remote.neo4j.key "property" .Values.externalSecrets.remote.neo4j.authProperty)))
  (dict "name" "nats-accounts" "data" (list (dict "secretKey" "accounts.conf" "key" .Values.externalSecrets.remote.nats.accountsKey "property" .Values.externalSecrets.remote.nats.accountsProperty)))
  (dict "name" "nats-tls" "data" (list
    (dict "secretKey" "ca.crt" "key" .Values.externalSecrets.remote.nats.tlsKey "property" .Values.externalSecrets.remote.nats.caProperty)
    (dict "secretKey" "tls.crt" "key" .Values.externalSecrets.remote.nats.tlsKey "property" .Values.externalSecrets.remote.nats.certificateProperty)
    (dict "secretKey" "tls.key" "key" .Values.externalSecrets.remote.nats.tlsKey "property" .Values.externalSecrets.remote.nats.privateKeyProperty)))
  (dict "name" "nats-api" "data" (list (dict "secretKey" "credentials" "key" .Values.externalSecrets.remote.nats.apiCredentialsKey "property" .Values.externalSecrets.remote.nats.credentialsProperty)))
  (dict "name" "nats-worker" "data" (list (dict "secretKey" "credentials" "key" .Values.externalSecrets.remote.nats.workerCredentialsKey "property" .Values.externalSecrets.remote.nats.credentialsProperty)))
  (dict "name" "nats-projector" "data" (list (dict "secretKey" "credentials" "key" .Values.externalSecrets.remote.nats.projectorCredentialsKey "property" .Values.externalSecrets.remote.nats.credentialsProperty)))
  (dict "name" "nats-admin" "data" (list (dict "secretKey" "credentials" "key" .Values.externalSecrets.remote.nats.adminCredentialsKey "property" .Values.externalSecrets.remote.nats.credentialsProperty)))
  (dict "name" "cloudflared" "data" (list (dict "secretKey" "token" "key" .Values.externalSecrets.remote.cloudflared.key "property" .Values.externalSecrets.remote.cloudflared.tokenProperty)))
}}
{{- range $secret := $secrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "deepref.componentName" (dict "root" $root "component" $secret.name) }}
  namespace: {{ include "deepref.namespace" $root }}
  labels:
    {{- include "deepref.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: {{ include "deepref.componentName" (dict "root" $root "component" $secret.name) }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $item := $secret.data }}
    - secretKey: {{ $item.secretKey }}
      remoteRef:
        key: {{ $item.key | quote }}
        property: {{ $item.property | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
{{- end }}
