{{- if .Values.externalSecrets.enabled }}
{{- $root := . }}
{{- $store := .Values.externalSecrets.secretStoreRef }}
{{- $refresh := .Values.externalSecrets.refreshInterval }}
{{- $secrets := list
  (dict "name" "database" "data" (list (dict "secretKey" "url" "key" .Values.externalSecrets.remote.database.key "property" .Values.externalSecrets.remote.database.urlProperty)))
  (dict "name" "cloudflared" "data" (list (dict "secretKey" "token" "key" .Values.externalSecrets.remote.cloudflared.key "property" .Values.externalSecrets.remote.cloudflared.tokenProperty)))
  (dict "name" "document-storage" "data" (list
    (dict "secretKey" "endpoint" "key" .Values.externalSecrets.remote.documentStorage.key "property" .Values.externalSecrets.remote.documentStorage.endpointProperty)
    (dict "secretKey" "bucket" "key" .Values.externalSecrets.remote.documentStorage.key "property" .Values.externalSecrets.remote.documentStorage.bucketProperty)
    (dict "secretKey" "region" "key" .Values.externalSecrets.remote.documentStorage.key "property" .Values.externalSecrets.remote.documentStorage.regionProperty)
    (dict "secretKey" "access_key_id" "key" .Values.externalSecrets.remote.documentStorage.key "property" .Values.externalSecrets.remote.documentStorage.accessKeyIdProperty)
    (dict "secretKey" "secret_access_key" "key" .Values.externalSecrets.remote.documentStorage.key "property" .Values.externalSecrets.remote.documentStorage.secretAccessKeyProperty)
  ))
}}
{{- range $secret := $secrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "deepref.componentName" (dict "root" $root "component" $secret.name) }}
  namespace: {{ include "deepref.namespace" $root }}
  labels:
    {{- include "deepref.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: {{ include "deepref.componentName" (dict "root" $root "component" $secret.name) }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $item := $secret.data }}
    - secretKey: {{ $item.secretKey }}
      remoteRef:
        key: {{ $item.key | quote }}
        property: {{ $item.property | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
{{- end }}
