suite: PostgreSQL migration job
templates:
  - templates/migration-job.yaml
values:
  - tests/values/development.yaml
tests:
  - it: runs migration as a PreSync hook
    template: templates/migration-job.yaml
    asserts:
      - equal: {path: 'metadata.annotations["argocd.argoproj.io/hook"]', value: PreSync}
      - contains: {path: "spec.template.spec.containers[0].args", content: migrate}
      - equal: {path: spec.backoffLimit, value: 0}
