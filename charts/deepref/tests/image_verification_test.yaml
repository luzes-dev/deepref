suite: image verification policy
templates:
  - templates/kyverno-verify-images.yaml
values:
  - tests/values/development.yaml
tests:
  - it: enforces signed digest verification
    asserts:
      - equal: {path: spec.failurePolicy, value: Fail}
      - equal: {path: "spec.rules[0].verifyImages[0].verifyDigest", value: true}
      - equal: {path: "spec.rules[0].verifyImages[0].required", value: true}
      - equal: {path: "spec.rules[0].verifyImages[0].mutateDigest", value: false}
