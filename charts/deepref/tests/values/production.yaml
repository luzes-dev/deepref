global:
  environment: production
images:
  api: {repository: docker.io/library/debian, digest: sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818}
  worker: {repository: docker.io/library/debian, digest: sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818}
  web: {repository: docker.io/library/caddy, digest: sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}
api:
  replicas: 3
  corsOrigins: [https://deepref.example.com]
worker: {replicas: 3}
web: {replicas: 3}
cloudflared: {replicas: 2}
externalSecrets:
  remote:
    database: {key: deepref/production/database, urlProperty: url}
    cloudflared: {key: deepref/production/cloudflared, tokenProperty: token}
networkPolicy:
  databaseEgress: {cidrs: [192.0.2.0/24], port: 5432}
  telemetryEgress: {cidrs: [198.51.100.0/24], ports: [443]}
  cloudflareEgress: {cidrs: [203.0.113.0/24], ports: [443, 7844]}
imageVerification:
  repositoryPatterns: ["docker.io/library/*", "docker.io/cloudflare/*", "docker.io/amazon/*"]
  keyless:
    subject: https://github.com/luzes-dev/deepref/.github/workflows/release.yml@refs/heads/development
