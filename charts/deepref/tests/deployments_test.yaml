suite: application deployments
templates:
  - templates/api-deployment.yaml
  - templates/worker-deployment.yaml
  - templates/projector-deployment.yaml
  - templates/web-deployment.yaml
values:
  - tests/values/development.yaml
tests:
  - it: renders four hardened deployments
    asserts:
      - hasDocuments: {count: 4}
  - it: pins every application image by digest
    asserts:
      - matchRegex: {path: "spec.template.spec.containers[0].image", pattern: "@sha256:[0-9a-f]{64}$"}
  - it: disables privilege escalation
    asserts:
      - equal: {path: "spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation", value: false}
  - it: uses RuntimeDefault seccomp
    asserts:
      - equal: {path: spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault}
