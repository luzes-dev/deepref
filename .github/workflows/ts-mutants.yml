name: TypeScript mutation testing

on:
  workflow_dispatch:
  schedule:
    # Run weekly deep mutation baseline on Sunday at 05:00 UTC
    - cron: "0 5 * * 0"

permissions:
  contents: read

jobs:
  mutants:
    name: TypeScript mutants report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f2760297130b4c5ff80 # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version-file: .mise.toml
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run StrykerJS mutation testing (report-only baseline)
        run: |
          pnpm --filter @deepref/web run test:mutation || true

      - name: Upload TypeScript mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ts-mutants-report-${{ github.sha }}
          path: apps/web/reports/mutation/
          retention-days: 30
