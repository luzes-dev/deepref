name: TypeScript mutation testing

on:
  workflow_dispatch:
  schedule:
    # Run weekly deep mutation baseline on Sunday at 05:00 UTC
    - cron: "0 5 * * 0"

permissions:
  contents: read

jobs:
  mutants:
    name: TypeScript mutants report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run StrykerJS mutation testing (report-only baseline)
        run: |
          pnpm --filter @deepref/web run test:mutation || true

      - name: Upload TypeScript mutation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ts-mutants-report-${{ github.sha }}
          path: apps/web/reports/mutation/
          retention-days: 30
