name: GitOps Policy

on:
  pull_request:
    branches: [gitops]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: gitops-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: Exact orphan tree and deployment diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted policy source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source
          persist-credentials: false
          ref: development
      - name: Checkout candidate GitOps tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate actor, exact tree, diff, and changed lock
        env:
          ACTOR: ${{ github.event.pull_request.user.login }}
          APP_SLUG: ${{ vars.DEPLOYMENT_APP_SLUG }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$APP_SLUG"
          test "$ACTOR" = "${APP_SLUG}[bot]"
          git -C candidate ls-tree -r --name-only "$HEAD_SHA" > "$RUNNER_TEMP/gitops-tree.txt"
          source/scripts/ci/validate-gitops-tree.sh "$RUNNER_TEMP/gitops-tree.txt"
          git -C candidate diff --binary "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/gitops.diff"
          source/scripts/ci/validate-gitops-diff.sh "$RUNNER_TEMP/gitops.diff"
          changed="$(git -C candidate diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          case "$changed" in
            environments/development/release-lock.yaml|environments/staging/release-lock.yaml|environments/production/release-lock.yaml)
              environment="${changed#environments/}"
              environment="${environment%%/*}"
              git -C candidate show "$HEAD_SHA:$changed" > "$RUNNER_TEMP/release-lock.yaml"
              (
                cd source
                scripts/ci/validate-release-lock.sh --environment "$environment" "$RUNNER_TEMP/release-lock.yaml"
                scripts/ci/verify-release-digests.sh "$RUNNER_TEMP/release-lock.yaml"
              )
              ;;
            environments/development/values.yaml|environments/staging/values.yaml|environments/production/values.yaml)
              source/scripts/ci/validate-gitops-values.sh --mode any "$RUNNER_TEMP/gitops.diff"
              ;;
            *)
              echo "Unsupported GitOps change: $changed" >&2
              exit 1
              ;;
          esac
