name: Promote Production

on:
  workflow_dispatch:
    inputs:
      manifest_reference:
        description: Digest-pinned tested release manifest OCI reference
        required: true
        type: string
      release_tree:
        description: Successfully deployed staging Git tree hash
        required: true
        type: string
      staging_deployment_id:
        description: Successful Argo staging deployment record ID
        required: true
        type: string

concurrency:
  group: promote-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read

env:
  AWS_REGION: sa-east-1

jobs:
  promote:
    name: Copy exact staging release and propose production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-promotion
    permissions:
      contents: read
      deployments: read
      id-token: write
    steps:
      - name: Require immutable inputs and successful staging deployment evidence
        env:
          DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_REFERENCE: ${{ inputs.manifest_reference }}
          RELEASE_TREE: ${{ inputs.release_tree }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_REFERENCE" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$RELEASE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOYMENT_ID" =~ ^[0-9]+$ ]]
          evidence="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" --jq '.[0]')"
          test "$(jq -r .state <<<"$evidence")" = success
          test "$(jq -r '.payload.release_tree // empty' <<<"$evidence")" = "$RELEASE_TREE"
      - name: Checkout trusted source automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: development
      - name: Assume cross-account production promotion role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PROMOTION_ROLE_ARN }}
          role-session-name: deepref-production-${{ github.run_id }}
      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with: {version: 1.3.0}
      - name: Set up Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with: {cosign-release: v2.5.3}
      - name: Install pinned release tooling
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.1 PyYAML==6.0.2
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/regctl" https://github.com/regclient/regclient/releases/download/v0.11.5/regctl-linux-amd64
          echo "c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467  $RUNNER_TEMP/regctl" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/regctl"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Authenticate staging and production registries
        env:
          DESTINATION_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
          SOURCE_REGISTRY: ${{ vars.STAGING_ECR_REGISTRY }}
        run: |
          password="$(aws ecr get-login-password --region "$AWS_REGION")"
          for registry in "$SOURCE_REGISTRY" "$DESTINATION_REGISTRY"; do
            printf '%s' "$password" | oras login --username AWS --password-stdin "$registry"
            printf '%s' "$password" | regctl registry login "$registry" --user AWS --pass-stdin
          done
      - name: Pull, verify, and copy the complete release
        env:
          DESTINATION_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
          MANIFEST_REFERENCE: ${{ inputs.manifest_reference }}
          REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
          RELEASE_TREE: ${{ inputs.release_tree }}
        run: |
          set -euo pipefail
          cosign verify --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$MANIFEST_REFERENCE" >/dev/null
          mkdir -p "$RUNNER_TEMP/release"
          oras pull "$MANIFEST_REFERENCE" --output "$RUNNER_TEMP/release"
          test "$(jq -r .source.tree "$RUNNER_TEMP/release/release-manifest.json")" = "$RELEASE_TREE"
          scripts/ci/copy-oci-release.sh --source-manifest "$RUNNER_TEMP/release/release-manifest.json" \
            --environment production --destination-registry "$DESTINATION_REGISTRY" \
            --repository-prefix "$REPOSITORY_PREFIX" --output "$RUNNER_TEMP/production-release-lock.yaml"
          python3 - "$RUNNER_TEMP/production-release-lock.yaml" <<'PY' | while IFS=$'\t' read -r name subject; do
          import pathlib, sys, yaml
          doc = yaml.safe_load(pathlib.Path(sys.argv[1]).read_text())
          for name, item in [("chart", doc["chart"]), *doc["images"].items()]: print(name, f"{item['repository']}@{item['digest']}", sep="\t")
          PY
            cosign verify --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$subject" >/dev/null
            if [[ $name != chart ]]; then
              cosign verify-attestation --type vuln --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$subject" >/dev/null
            fi
          done
      - name: Mint deployment App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout protected GitOps branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: gitops
          persist-credentials: false
          ref: gitops
          token: ${{ steps.app-token.outputs.token }}
      - name: Require deployed staging identity and open production PR
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TREE: ${{ inputs.release_tree }}
        run: |
          set -euo pipefail
          scripts/ci/verify-release-digests.sh --source-manifest "$RUNNER_TEMP/release/release-manifest.json" gitops/environments/staging/release-lock.yaml
          cd gitops
          branch="deploy/production/$RELEASE_TREE"
          git switch -c "$branch"
          cp "$RUNNER_TEMP/production-release-lock.yaml" environments/production/release-lock.yaml
          git add environments/production/release-lock.yaml
          git -c user.name="${APP_SLUG}[bot]" -c user.email="${APP_SLUG}[bot]@users.noreply.github.com" commit -m "deploy(production): tree $RELEASE_TREE"
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          export GH_TOKEN="$APP_TOKEN"
          gh pr create --base gitops --head "$branch" --title "deploy(production): tree $RELEASE_TREE" \
            --body "Promotes the exact signed staging release. Two approvals and the production environment gate are required."
