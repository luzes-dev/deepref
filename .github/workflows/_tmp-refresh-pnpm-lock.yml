name: Temporary pnpm lock refresh

on:
  push:
    branches: [fix/development-validation-20260829]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/development-validation-20260829
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - name: Refresh lockfile and verify audit
        run: |
          pnpm install --lockfile-only
          pnpm audit --audit-level high
      - name: Commit refreshed lockfile and remove helper
        run: |
          rm .github/workflows/_tmp-refresh-pnpm-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/_tmp-refresh-pnpm-lock.yml
          git commit -m "chore: refresh patched pnpm lock entries"
          git push origin HEAD:fix/development-validation-20260829
