name: Temporary validation repair helper

on:
  push:
    branches: [fix/development-validation-20260829]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/development-validation-20260829
      - name: Patch exact Playwright text assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/routes/page.svelte.e2e.ts')
          text = path.read_text()
          replacements = {
              "page.getByText('1 project runs')": "page.getByText('1 project runs', { exact: true })",
              "page.getByText('2 project runs')": "page.getByText('2 project runs', { exact: true })",
          }
          expected = {
              "page.getByText('1 project runs')": 3,
              "page.getByText('2 project runs')": 1,
          }
          for old, count in expected.items():
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'expected {count} occurrences of {old!r}, found {actual}')
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print compact pnpm audit findings
        run: |
          set +e
          pnpm audit --audit-level high --json > /tmp/pnpm-audit.json
          status=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/pnpm-audit.json', 'utf8'));
          const advisories = data.advisories ?? {};
          const vulnerabilities = data.vulnerabilities ?? {};
          if (Object.keys(advisories).length) {
            for (const [id, a] of Object.entries(advisories)) {
              console.log(JSON.stringify({
                id,
                module: a.module_name,
                severity: a.severity,
                title: a.title,
                vulnerable_versions: a.vulnerable_versions,
                patched_versions: a.patched_versions,
                recommendation: a.recommendation,
                url: a.url,
                findings: a.findings
              }));
            }
          } else if (Object.keys(vulnerabilities).length) {
            for (const [name, v] of Object.entries(vulnerabilities)) {
              console.log(JSON.stringify({name, ...v}));
            }
          } else {
            console.log(JSON.stringify(data));
          }
          NODE
          echo "pnpm_audit_exit=$status"
      - name: Commit Playwright repair and remove helper
        run: |
          rm .github/workflows/_tmp-finish-validation-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/routes/page.svelte.e2e.ts .github/workflows/_tmp-finish-validation-repair.yml
          git commit -m "test: make project run count assertions exact"
          git push origin HEAD:fix/development-validation-20260829
