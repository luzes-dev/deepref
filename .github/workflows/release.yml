name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [development]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: sa-east-1

jobs:
  build-once:
    name: Build, attest, and propose development release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'development' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: development-release
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
      ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the tested source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify trusted development ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin development
          git merge-base --is-ancestor "$SOURCE_SHA" origin/development
      - name: Derive immutable release identity
        id: identity
        run: |
          set -euo pipefail
          tree_hash="$(git rev-parse 'HEAD^{tree}')"
          created_at="$(git show -s --format=%cI HEAD)"
          migration_version="$(find services/api/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | LC_ALL=C sort | tail -n 1 | sed -E 's/^([0-9]+).*/\1/')"
          test -n "$migration_version"
          {
            echo "tree_hash=$tree_hash"
            echo "created_at=$created_at"
            echo "migration_version=$migration_version"
          } >> "$GITHUB_OUTPUT"
      - name: Assume the development release role with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          role-session-name: deepref-release-${{ github.run_id }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.0
      - name: Install pinned schema dependencies and regctl
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.1 PyYAML==6.0.2
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/regctl" \
            https://github.com/regclient/regclient/releases/download/v0.11.5/regctl-linux-amd64
          echo "c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467  $RUNNER_TEMP/regctl" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/regctl"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.3
      - name: Authenticate to immutable ECR repositories
        run: |
          set -euo pipefail
          password="$(aws ecr get-login-password --region "$AWS_REGION")"
          printf '%s' "$password" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          printf '%s' "$password" | helm registry login --username AWS --password-stdin "$ECR_REGISTRY"
          printf '%s' "$password" | oras login --username AWS --password-stdin "$ECR_REGISTRY"
          printf '%s' "$password" | regctl registry login "$ECR_REGISTRY" --user AWS --pass-stdin
      - name: Build and push API once
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.15.0
        with:
          context: .
          file: docker/rust-service.Dockerfile
          build-args: |
            PACKAGE=deepref-api
            BIN=deepref-api
            SOURCE_COMMIT=${{ env.SOURCE_SHA }}
            SOURCE_TREE=${{ steps.identity.outputs.tree_hash }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/api:tree-${{ steps.identity.outputs.tree_hash }}
          provenance: mode=max
          sbom: true
      - name: Build and push worker once
        id: worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.15.0
        with:
          context: .
          file: docker/rust-service.Dockerfile
          build-args: |
            PACKAGE=deepref-worker
            BIN=deepref-worker
            SOURCE_COMMIT=${{ env.SOURCE_SHA }}
            SOURCE_TREE=${{ steps.identity.outputs.tree_hash }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/worker:tree-${{ steps.identity.outputs.tree_hash }}
          provenance: mode=max
          sbom: true
      - name: Build and push projector once
        id: projector
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.15.0
        with:
          context: .
          file: docker/rust-service.Dockerfile
          build-args: |
            PACKAGE=deepref-projector
            BIN=deepref-projector
            SOURCE_COMMIT=${{ env.SOURCE_SHA }}
            SOURCE_TREE=${{ steps.identity.outputs.tree_hash }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/projector:tree-${{ steps.identity.outputs.tree_hash }}
          provenance: mode=max
          sbom: true
      - name: Build and push web once
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.15.0
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            SOURCE_COMMIT=${{ env.SOURCE_SHA }}
            SOURCE_TREE=${{ steps.identity.outputs.tree_hash }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/web:tree-${{ steps.identity.outputs.tree_hash }}
          provenance: mode=max
          sbom: true
      - name: Package and push the chart once
        id: chart
        env:
          TREE_HASH: ${{ steps.identity.outputs.tree_hash }}
        run: |
          set -euo pipefail
          base_version="$(awk '$1 == "version:" {print $2; exit}' charts/deepref/Chart.yaml)"
          test -n "$base_version"
          chart_version="${base_version}+tree.${TREE_HASH:0:12}"
          helm dependency build charts/deepref
          helm package charts/deepref --destination dist --version "$chart_version" --app-version "$SOURCE_SHA"
          output="$(helm push "dist/deepref-${chart_version}.tgz" "oci://${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}" 2>&1)"
          printf '%s\n' "$output"
          digest="$(printf '%s\n' "$output" | awk '/Digest:/ {print $2}' | tail -n 1)"
          test "${digest#sha256:}" != "$digest"
          {
            echo "digest=$digest"
            echo "version=$chart_version"
          } >> "$GITHUB_OUTPUT"
      - name: Scan API release subject
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/api@${{ steps.api.outputs.digest }}
          format: cosign-vuln
          output: api-vulnerability.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan worker release subject
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/worker@${{ steps.worker.outputs.digest }}
          format: cosign-vuln
          output: worker-vulnerability.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan projector release subject
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/projector@${{ steps.projector.outputs.digest }}
          format: cosign-vuln
          output: projector-vulnerability.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan web release subject
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/web@${{ steps.web.outputs.digest }}
          format: cosign-vuln
          output: web-vulnerability.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Sign every immutable release subject
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          PROJECTOR_DIGEST: ${{ steps.projector.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          set -euo pipefail
          for subject in \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/api@$API_DIGEST" \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/worker@$WORKER_DIGEST" \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/projector@$PROJECTOR_DIGEST" \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/web@$WEB_DIGEST" \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/deepref@$CHART_DIGEST"; do
            cosign sign --yes "$subject"
          done
          cosign attest --yes --type vuln --predicate api-vulnerability.json \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/api@$API_DIGEST"
          cosign attest --yes --type vuln --predicate worker-vulnerability.json \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/worker@$WORKER_DIGEST"
          cosign attest --yes --type vuln --predicate projector-vulnerability.json \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/projector@$PROJECTOR_DIGEST"
          cosign attest --yes --type vuln --predicate web-vulnerability.json \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/web@$WEB_DIGEST"
          certificate_identity="https://github.com/$GITHUB_WORKFLOW_REF"
          for subject in \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/api@$API_DIGEST" \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/worker@$WORKER_DIGEST" \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/projector@$PROJECTOR_DIGEST" \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/web@$WEB_DIGEST" \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/deepref@$CHART_DIGEST"; do
            cosign verify \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$subject" >/dev/null
          done
          for subject in \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/api@$API_DIGEST" \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/worker@$WORKER_DIGEST" \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/projector@$PROJECTOR_DIGEST" \
            "$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/web@$WEB_DIGEST"; do
            cosign verify-attestation --type vuln \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$subject" >/dev/null
          done
      - name: Create and publish release manifest
        id: manifest
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          CREATED_AT: ${{ steps.identity.outputs.created_at }}
          MIGRATION_VERSION: ${{ steps.identity.outputs.migration_version }}
          PROJECTOR_DIGEST: ${{ steps.projector.outputs.digest }}
          TREE_HASH: ${{ steps.identity.outputs.tree_hash }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="$SOURCE_SHA" GIT_TREE_HASH="$TREE_HASH" CREATED_AT
          export CHART_REPOSITORY="$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/deepref" CHART_VERSION CHART_DIGEST
          export API_REPOSITORY="$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/api" API_DIGEST
          export WORKER_REPOSITORY="$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/worker" WORKER_DIGEST
          export PROJECTOR_REPOSITORY="$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/projector" PROJECTOR_DIGEST
          export WEB_REPOSITORY="$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/web" WEB_DIGEST MIGRATION_VERSION
          referrer_set() {
            regctl artifact list --digest-tags --format '{{json .Manifest}}' "$1" |
              jq -c '[.manifests[]? | {
                digest: .digest,
                mediaType: .mediaType,
                artifactType: (.artifactType // null)
              }] | sort_by(.digest, .mediaType, .artifactType)'
          }
          CHART_REFERRERS_JSON="$(referrer_set "$CHART_REPOSITORY@$CHART_DIGEST")"
          API_REFERRERS_JSON="$(referrer_set "$API_REPOSITORY@$API_DIGEST")"
          WORKER_REFERRERS_JSON="$(referrer_set "$WORKER_REPOSITORY@$WORKER_DIGEST")"
          PROJECTOR_REFERRERS_JSON="$(referrer_set "$PROJECTOR_REPOSITORY@$PROJECTOR_DIGEST")"
          WEB_REFERRERS_JSON="$(referrer_set "$WEB_REPOSITORY@$WEB_DIGEST")"
          export CHART_REFERRERS_JSON API_REFERRERS_JSON WORKER_REFERRERS_JSON PROJECTOR_REFERRERS_JSON WEB_REFERRERS_JSON
          scripts/ci/create-release-manifest.sh release-manifest.json
          jq '. + {environment:"development"}' release-manifest.json > development-release-lock.yaml
          scripts/ci/validate-release-lock.sh --environment development --manifest release-manifest.json development-release-lock.yaml
          scripts/ci/verify-release-digests.sh --remote --source-manifest release-manifest.json development-release-lock.yaml
          manifest_repository="$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/releases"
          oras push "$manifest_repository:tree-$TREE_HASH" \
            --artifact-type application/vnd.deepref.release-manifest.v1+json \
            "release-manifest.json:application/vnd.deepref.release-manifest.v1+json"
          manifest_digest="$(oras resolve "$manifest_repository:tree-$TREE_HASH")"
          cosign sign --yes "$manifest_repository@$manifest_digest"
          cosign verify \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$manifest_repository@$manifest_digest" >/dev/null
          {
            echo "digest=$manifest_digest"
            echo "reference=$manifest_repository@$manifest_digest"
          } >> "$GITHUB_OUTPUT"
      - name: Mint a least-privilege deployment App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout protected GitOps branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: gitops
          persist-credentials: false
          ref: gitops
          token: ${{ steps.app-token.outputs.token }}
      - name: Open development GitOps PR
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          MANIFEST_REFERENCE: ${{ steps.manifest.outputs.reference }}
          TREE_HASH: ${{ steps.identity.outputs.tree_hash }}
        run: |
          set -euo pipefail
          cd gitops
          branch="deploy/dev/$TREE_HASH"
          git switch -c "$branch"
          mkdir -p environments/development
          cp ../development-release-lock.yaml environments/development/release-lock.yaml
          git add environments/development/release-lock.yaml
          git -c user.name="${APP_SLUG}[bot]" \
              -c user.email="${APP_SLUG}[bot]@users.noreply.github.com" \
              commit -m "deploy(development): tree $TREE_HASH"
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          export GH_TOKEN="$APP_TOKEN"
          pr_url="$(gh pr list --head "$branch" --base gitops --state open --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base gitops --head "$branch" \
              --title "deploy(development): tree $TREE_HASH" \
              --body "Immutable development release from source commit $SOURCE_SHA. Release manifest: $MANIFEST_REFERENCE")"
          fi
          gh pr merge "$pr_url" --auto --squash
          printf 'Development GitOps PR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
