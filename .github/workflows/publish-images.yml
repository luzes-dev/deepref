name: Publish Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. 1.0.0 or edge; defaults to git tag or short commit SHA)'
        required: false
        default: ''

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  publish:
    name: Build and publish container images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require successful CI for the checked-out commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          run_id="$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f head_sha="$sha" -f event=push -f per_page=1 \
            --jq '.workflow_runs[0] | select(.status == "completed" and .conclusion == "success") | .id')"
          if [[ -z "$run_id" ]]; then
            echo "::error::The latest push CI run for $sha must be completed and successful before publishing."
            exit 1
          fi
          echo "Publishing commit $sha validated by CI run $run_id."

      - name: Resolve publication metadata
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ github.ref }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          tree_hash="$(git rev-parse 'HEAD^{tree}')"
          short_sha="$(git rev-parse --short HEAD)"

          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$SOURCE_REF" =~ ^refs/tags/v(.+) ]]; then
            tag="${BASH_REMATCH[1]}"
          else
            tag="$short_sha"
          fi

          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ || "$tag" == "latest" ]]; then
            echo "::error::Image tag must be a valid Docker tag; latest is reserved for stable releases."
            exit 1
          fi
          publish_latest=false
          if [[ "$SOURCE_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ && "$tag" == "${BASH_REMATCH[1]}" ]]; then
            publish_latest=true
          fi
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"

          {
            echo "tag=$tag"
            echo "publish_latest=$publish_latest"
            echo "tree_hash=$tree_hash"
            echo "registry=ghcr.io/$owner"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing images with tag: $tag (registry: ghcr.io/$owner, tree: $tree_hash)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          IMAGE_PREFIX: deepref
          TAG: ${{ steps.meta.outputs.tag }}
          PUBLISH_LATEST: ${{ steps.meta.outputs.publish_latest }}
          OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          OCI_REVISION: ${{ github.sha }}
          OCI_VERSION: ${{ steps.meta.outputs.tag }}
          GIT_TREE_HASH: ${{ steps.meta.outputs.tree_hash }}
          DEEPREF_ATTESTATIONS: true
        with:
          source: .
          targets: api,worker,web
          push: true
          set: |
            api.cache-from=type=gha,scope=deepref-rust-amd64
            worker.cache-from=type=gha,scope=deepref-rust-amd64
            web.cache-from=type=gha,scope=deepref-web-amd64
