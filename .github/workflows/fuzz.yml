name: Rust hostile-input fuzzing

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Fuzz target to run (fuzz_doi_normalization, fuzz_title_normalization, fuzz_screening_parser, or all)"
        required: false
        default: "fuzz_doi_normalization"
        type: string
      duration:
        description: "Maximum run time in seconds per target"
        required: false
        default: "60"
        type: string
  schedule:
    # Run weekly time-bounded fuzzing on Sunday at 06:00 UTC
    - cron: "0 6 * * 0"

permissions:
  contents: read

jobs:
  fuzz:
    name: Rust fuzzing lane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust toolchain for libFuzzer
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Install pinned cargo-fuzz
        run: |
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.13.2/cargo-fuzz-0.13.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/cargo-fuzz.tar.gz"
          echo "b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c  $RUNNER_TEMP/cargo-fuzz.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.cargo/bin"
          tar --extract --gzip --file "$RUNNER_TEMP/cargo-fuzz.tar.gz" --directory "$HOME/.cargo/bin"

      - name: Run time-bounded fuzzing
        env:
          FUZZ_TARGET: ${{ inputs.target || 'all' }}
          FUZZ_DURATION: ${{ inputs.duration || '60' }}
        run: |
          TARGET="$FUZZ_TARGET"
          DURATION="$FUZZ_DURATION"

          run_target() {
            local t="$1"
            echo "::group::Fuzzing $t for ${DURATION}s"
            cargo fuzz run "$t" -- -max_total_time="$DURATION"
            echo "::endgroup::"
          }

          if [ "$TARGET" = "all" ]; then
            run_target fuzz_doi_normalization
            run_target fuzz_title_normalization
            run_target fuzz_screening_parser
          else
            run_target "$TARGET"
          fi

      - name: Upload artifacts on crash or findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-findings-${{ github.sha }}
          path: fuzz/artifacts/
          retention-days: 30
