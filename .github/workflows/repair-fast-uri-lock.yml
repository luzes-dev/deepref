name: Repair fast-uri lockfile

on:
  push:
    branches:
      - fix/codeql-cloudflare-access-host-validation

permissions:
  contents: write

jobs:
  repair:
    name: Regenerate lockfile for fast-uri 3.1.6
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/codeql-cloudflare-access-host-validation

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Set up pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Regenerate lockfile and commit the repair
        run: |
          set -euo pipefail
          sed -i 's/fast-uri: 3\.1\.5/fast-uri: 3.1.6/' pnpm-workspace.yaml
          pnpm install --lockfile-only --ignore-scripts
          rm .github/workflows/repair-fast-uri-lock.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-workspace.yaml pnpm-lock.yaml .github/workflows/repair-fast-uri-lock.yml
          git commit -m 'fix(deps): bump fast-uri to 3.1.6'
          git push origin HEAD:fix/codeql-cloudflare-access-host-validation
