name: Refresh vulnerable lock entry

on:
  push:
    branches: [fix/post-dependabot-validation]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Regenerate patched lock entry
        run: cargo update -p event-listener --precise 5.4.2
      - name: Commit generated lockfile and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/refresh-lock.yml
          git commit -m "chore: refresh event-listener lock entry"
          git push origin HEAD:fix/post-dependabot-validation
