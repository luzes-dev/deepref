name: CI / Browser E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      # actions/cache's implicit post-save lost its reservation whenever cache
      # traffic peaked ("another job may be creating this cache"). Restore and
      # save are split explicitly, and save only runs when the lockfile key
      # missed, i.e. once per Playwright version bump.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            playwright-${{ runner.os }}-
      - name: Install Chromium
        run: pnpm --filter @deepref/web exec playwright install --with-deps chromium
      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Browser tests consume the preview build.  If the build fails, the
      # browser probe is blocked rather than run against a known-broken tree.
      - name: Probe preview build
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check e2e.build
      - name: Probe browser tests
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check e2e.browser
      - name: Gate browser lane
        if: always()
        run: python3 scripts/ci/diagnose.py gate e2e
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-e2e
          path: target/ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7
