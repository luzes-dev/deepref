name: CI

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  docs:
    name: Documentation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate operations, acceptance, and links
        run: bash scripts/check-docs.sh

  rust:
    name: Rust / ${{ matrix.command }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        command: [fmt, clippy, test]
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.95.0
      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.95.0-${{ matrix.command }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.95.0-${{ matrix.command }}-
      - name: Run check
        env:
          COMMAND: ${{ matrix.command }}
        run: |
          case "$COMMAND" in
            fmt) cargo fmt --all -- --check ;;
            clippy) cargo clippy --workspace --all-targets --locked -- -D warnings ;;
            test) cargo test --workspace --all-targets --locked ;;
          esac

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541dca151540678f0b70b4003d8bda # v4.0.3
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm --filter @deepref/web test:unit -- --run
      - run: pnpm run build

  codegen:
    name: OpenAPI and Orval drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Set up pnpm
        uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541dca151540678f0b70b4003d8bda # v4.0.3
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:api:check
      - name: Prove drift check left the tree clean
        run: git diff --exit-code

  full-stack:
    name: Full-stack integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Set up pnpm
        uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541dca151540678f0b70b4003d8bda # v4.0.3
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned task runner
        run: cargo install --locked just --version 1.42.4
      - name: Start disposable dependencies
        run: docker compose -f infra/local/compose.yaml up -d --wait
      - name: Run integration tests
        run: just test-integration
      - name: Install Chromium
        run: pnpm --filter @deepref/web exec playwright install --with-deps chromium
      - name: Run browser tests
        run: just test-e2e
      - name: Stop disposable dependencies
        if: always()
        run: docker compose -f infra/local/compose.yaml down --volumes

  containers:
    name: Reproducible container build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Validate and build every release target
        run: |
          docker buildx bake --print
          docker buildx bake --set '*.output=type=cacheonly' api worker projector web
