name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'services/**'
              - 'tools/**'
              - 'review-definitions/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.sqlx/**'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            containers:
              - 'docker/**'
              - 'docker-bake.hcl'
              - 'apps/web/Dockerfile'
              - 'apps/web/Caddyfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'services/**'
              - 'apps/web/**'
              - '.github/actions/reproducible-container-build/**'
              - '.github/workflows/ci.yml'

  docs:
    name: Documentation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install documentation tooling
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Validate operations, acceptance, and links
        run: bash scripts/check-docs.sh

  rust:
    name: Rust / ${{ matrix.command }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        command: [fmt, clippy, test]
    steps:
      - name: Skip check (no Rust changes)
        if: github.event_name != 'push' && needs.changes.outputs.rust != 'true'
        run: echo "No Rust changes detected in PR; skipping check."
      - name: Checkout trusted source
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        env:
          COMMAND: ${{ matrix.command }}
        run: |
          case "$COMMAND" in
            fmt) rustup toolchain install 1.95.0 --profile minimal --component rustfmt ;;
            clippy) rustup toolchain install 1.95.0 --profile minimal --component clippy ;;
            test) rustup toolchain install 1.95.0 --profile minimal ;;
          esac
          rustup override set 1.95.0
      - name: Install pinned cargo-nextest
        if: (github.event_name == 'push' || needs.changes.outputs.rust == 'true') && matrix.command == 'test'
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-nextest@0.9.143
          checksum: true
          fallback: none
      - name: Restore shared Cargo cache
        if: (github.event_name == 'push' || needs.changes.outputs.rust == 'true') && matrix.command != 'test'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-1.95.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.95.0-
      - name: Restore and update shared Cargo cache
        if: (github.event_name == 'push' || needs.changes.outputs.rust == 'true') && matrix.command == 'test'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-1.95.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.95.0-
      - name: Set up sccache for compile-heavy checks
        if: (github.event_name == 'push' || needs.changes.outputs.rust == 'true') && matrix.command != 'fmt'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Enable sccache compiler wrapper
        if: (github.event_name == 'push' || needs.changes.outputs.rust == 'true') && matrix.command != 'fmt'
        env:
          COMMAND: ${{ matrix.command }}
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            if [[ "$COMMAND" == "test" ]]; then
              echo "SCCACHE_GHA_RW_MODE=READ_WRITE"
            else
              echo "SCCACHE_GHA_RW_MODE=READ_ONLY"
            fi
          } >> "$GITHUB_ENV"
      - name: Validate Cargo workspace architecture
        if: (github.event_name == 'push' || needs.changes.outputs.rust == 'true') && matrix.command == 'fmt'
        run: |
          cargo xtask boundaries
          cargo test -p xtask --locked
      - name: Run check
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        env:
          COMMAND: ${{ matrix.command }}
          SQLX_OFFLINE: "true"
        run: |
          case "$COMMAND" in
            fmt) cargo fmt --all -- --check ;;
            clippy) cargo clippy --workspace --lib --bins --tests --examples --locked -- -D warnings ;;
            test)
              cargo nextest run --workspace --lib --bins --tests --examples --locked
              cargo test --doc --workspace --locked
              ;;
          esac
      - name: Show sccache statistics
        if: always() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true') && matrix.command != 'fmt'
        run: ${SCCACHE_PATH:-sccache} --show-stats

  ai-pr15-gates:
    name: AI PR15 evaluation and security gates
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip check (no Rust changes)
        if: github.event_name != 'push' && needs.changes.outputs.rust != 'true'
        run: echo "No Rust changes detected in PR; skipping check."
      - name: Checkout trusted source
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Install pinned cargo-nextest
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-nextest@0.9.143
          checksum: true
          fallback: none
      - name: Restore shared Cargo cache
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-1.95.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.95.0-
      - name: Set up sccache
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Enable read-only sccache compiler wrapper
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "SCCACHE_GHA_RW_MODE=READ_ONLY"
            echo "RUSTC_WRAPPER=sccache"
          } >> "$GITHUB_ENV"
      - name: Run checked-in gold-set evaluation gate
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        env:
          SQLX_OFFLINE: "true"
        run: cargo nextest run -p deepref-ai --test eval_gate --locked
      - name: Run prompt-injection and security regressions
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        env:
          SQLX_OFFLINE: "true"
        run: cargo nextest run -p deepref-ai --test prompt_injection_regressions --locked
      - name: Show sccache statistics
        if: always() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true')
        run: ${SCCACHE_PATH:-sccache} --show-stats

  coverage:
    name: Coverage / Rust
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.rust == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component llvm-tools-preview
          rustup override set 1.95.0
      - name: Install pinned tools
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-llvm-cov@0.9.0,cargo-nextest@0.9.143
          checksum: true
          fallback: none
      - name: Restore shared Cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-1.95.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.95.0-
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Enable read-only sccache compiler wrapper
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "SCCACHE_GHA_RW_MODE=READ_ONLY"
            echo "RUSTC_WRAPPER=sccache"
          } >> "$GITHUB_ENV"
      - name: Run Rust test coverage
        env:
          SQLX_OFFLINE: "true"
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov nextest --lcov --output-path target/llvm-cov/lcov.info --locked
          cargo llvm-cov report --summary-only
      - name: Retain coverage artifact for main risk analysis
        run: |
          mkdir -p coverage/rust
          cp target/llvm-cov/lcov.info coverage/rust/lcov.info
          git rev-parse HEAD > coverage/rust/revision.txt
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-${{ github.sha }}
          path: coverage/rust/
          retention-days: 14
      - name: Show sccache statistics
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats

  web:
    name: Web
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Skip check (no Web changes)
        if: github.event_name != 'push' && needs.changes.outputs.web != 'true'
        run: echo "No Web changes detected in PR; skipping check."
      - name: Checkout trusted source
        if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile
      - name: Restore web lint caches
        if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/web/.cache/eslint
            apps/web/.cache/prettier
          key: web-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/.prettierrc', 'apps/web/eslint.config.*') }}-${{ github.sha }}
          restore-keys: web-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/.prettierrc', 'apps/web/eslint.config.*') }}-
      - if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
        run: pnpm run lint
      - if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
        run: pnpm run check
      - if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
        run: pnpm --filter @deepref/web test:coverage
      - if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
        run: pnpm run build

  fallow:
    name: Fallow
    if: github.event_name == 'pull_request'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip check (no Web changes)
        if: needs.changes.outputs.web != 'true'
        run: echo "No Web changes detected in PR; skipping check."
      - name: Checkout trusted source with history
        if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm
        if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - if: needs.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile
      - name: Gate new TypeScript quality issues
        if: needs.changes.outputs.web == 'true'
        env:
          FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm run quality:ts:audit

  duplication:
    name: Duplication / Rust
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip check (no Rust changes)
        if: github.event_name != 'push' && needs.changes.outputs.rust != 'true'
        run: echo "No Rust changes detected in PR; skipping check."
      - name: Checkout trusted source
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run Rust duplication analysis
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
        run: pnpm run quality:rust:duplication
      - name: Upload duplication report
        if: always() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-duplication-report
          path: reports/duplication-rust

  codegen:
    name: OpenAPI and Orval drift
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip check (no Rust or Web changes)
        if: github.event_name != 'push' && needs.changes.outputs.rust != 'true' && needs.changes.outputs.web != 'true'
        run: echo "No Rust or Web changes detected in PR; skipping check."
      - name: Checkout trusted source
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Restore shared Cargo cache
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-1.95.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.95.0-
      - name: Set up sccache
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Enable read-only sccache compiler wrapper
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "SCCACHE_GHA_RW_MODE=READ_ONLY"
            echo "RUSTC_WRAPPER=sccache"
          } >> "$GITHUB_ENV"
      - name: Set up pnpm
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile
      - if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        run: pnpm run generate:api:check
        env:
          SQLX_OFFLINE: "true"
      - name: Prove drift check left the tree clean
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        run: git diff --exit-code
      - name: Show sccache statistics
        if: always() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true')
        run: ${SCCACHE_PATH:-sccache} --show-stats

  full-stack:
    name: Full-stack integration
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Skip check (no Rust, Web, or Container changes)
        if: github.event_name != 'push' && needs.changes.outputs.rust != 'true' && needs.changes.outputs.web != 'true' && needs.changes.outputs.containers != 'true'
        run: echo "No Rust, Web, or Container changes detected in PR; skipping check."
      - name: Checkout trusted source
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Install pinned cargo-nextest
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-nextest@0.9.143
          checksum: true
          fallback: none
      - name: Install pinned cargo-binstall
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-binstall@1.22.0
          checksum: true
          fallback: none
      - name: Install pinned sqlx-cli
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        run: cargo binstall --no-confirm sqlx-cli@0.9.0
      - name: Restore shared Cargo cache
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-1.95.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.95.0-
      - name: Set up sccache
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Enable read-only sccache compiler wrapper
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "SCCACHE_GHA_RW_MODE=READ_ONLY"
            echo "RUSTC_WRAPPER=sccache"
          } >> "$GITHUB_ENV"
      - name: Start disposable dependencies
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        run: docker compose -f compose.yaml up -d --wait
      - name: Apply database migrations
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/deepref
        run: |
          cargo sqlx migrate run \
            --source crates/postgres/migrations \
            --database-url "$DATABASE_URL" \
            --no-dotenv
      - name: Verify SQLx offline query metadata against live database
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/deepref
        run: cargo xtask sqlx check
      - name: Run integration tests
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        run: cargo nextest run --workspace --tests --locked
      - name: Show sccache statistics
        if: always() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true')
        run: ${SCCACHE_PATH:-sccache} --show-stats
      - name: Stop disposable dependencies
        if: always() && (github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true')
        run: docker compose -f compose.yaml down --volumes

  browser-e2e:
    name: Browser E2E
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Skip check (no Rust, Web, or Container changes)
        if: github.event_name != 'push' && needs.changes.outputs.rust != 'true' && needs.changes.outputs.web != 'true' && needs.changes.outputs.containers != 'true'
        run: echo "No Rust, Web, or Container changes detected in PR; skipping browser tests."
      - name: Checkout trusted source
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        run: pnpm --filter @deepref/web exec playwright install --with-deps chromium
      - name: Run browser tests
        if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.containers == 'true'
        run: pnpm --filter @deepref/web test:e2e

  containers:
    name: Reproducible container build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Skip check (no container changes)
        if: github.event_name != 'push' && needs.changes.outputs.containers != 'true'
        run: echo "No container changes detected in PR; skipping check."
      - name: Checkout trusted source
        if: github.event_name == 'push' || needs.changes.outputs.containers == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release images on native amd64
        if: github.event_name == 'push' || needs.changes.outputs.containers == 'true'
        uses: ./.github/actions/reproducible-container-build
        with:
          platform: linux/amd64
          cache-arch: amd64

  containers-arm64:
    name: Reproducible container build / arm64
    if: github.event_name == 'push'
    needs: changes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release images on native arm64
        uses: ./.github/actions/reproducible-container-build
        with:
          platform: linux/arm64
          cache-arch: arm64

  rust-required:
    name: Rust
    if: always()
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify Rust checks
        env:
          RESULT: ${{ needs.rust.result }}
        run: test "$RESULT" = "success"

  e2e-required:
    name: E2E
    if: always()
    needs: [full-stack, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify E2E checks
        env:
          INTEGRATION_RESULT: ${{ needs.full-stack.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
        run: |
          test "$INTEGRATION_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"

  docker-required:
    name: Docker
    if: always()
    needs: [containers, containers-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify container builds
        env:
          AMD64_RESULT: ${{ needs.containers.result }}
          ARM64_RESULT: ${{ needs.containers-arm64.result }}
        run: |
          test "$AMD64_RESULT" = "success"
          test "$ARM64_RESULT" = "success" || test "$ARM64_RESULT" = "skipped"
