name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  # Merge-queue runs carry the queued PR's number in the event payload; the
  # event-name prefix keeps a PR run and its queued merge-commit run from
  # cancelling each other while queue retries still supersede each other.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      codegen: ${{ steps.filter.outputs.codegen }}
      integration: ${{ steps.filter.outputs.integration }}
      containers-pr: ${{ steps.filter.outputs.containers-pr }}
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'apps/server/**'
              - 'scripts/ci/**'
              - 'crates/**'
              - 'services/**'
              - 'tools/**'
              - 'review-definitions/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.sqlx/**'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-rust.yml'
              - '.github/workflows/ci-integration.yml'
              - '.github/actions/setup-rust/**'
            web:
              - 'scripts/ci/**'
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-web.yml'
              - '.github/workflows/ci-e2e.yml'
              - '.github/actions/setup-node/**'
            codegen:
              - 'apps/server/**'
              - 'scripts/ci/**'
              - 'crates/**'
              - 'services/**'
              - 'tools/**'
              - 'review-definitions/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.sqlx/**'
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'docs/openapi.json'
              - 'scripts/check-api-codegen.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-codegen.yml'
              - '.github/actions/setup-rust/**'
              - '.github/actions/setup-node/**'
            integration:
              - 'apps/server/**'
              - 'scripts/ci/**'
              - 'crates/**'
              - 'services/**'
              - 'tools/**'
              - 'review-definitions/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.sqlx/**'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-integration.yml'
              - '.github/actions/setup-rust/**'
            containers-pr:
              - 'scripts/ci/**'
              - 'docker/**'
              - 'docker-bake.hcl'
              - 'apps/web/Dockerfile'
              - 'apps/web/Caddyfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.sqlx/**'
              - '.github/actions/reproducible-container-build/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-containers.yml'

  docs:
    name: Documentation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate operations, acceptance, and links
        run: bash scripts/check-docs.sh

  rust-checks:
    name: Rust checks
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/ci-rust.yml
    with:
      run-coverage: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.rust == 'true' }}

  web-checks:
    name: Web checks
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/ci-web.yml

  codegen-checks:
    name: Codegen check
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.codegen == 'true'
    uses: ./.github/workflows/ci-codegen.yml

  integration-checks:
    name: Integration checks
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.integration == 'true'
    uses: ./.github/workflows/ci-integration.yml

  e2e-checks:
    name: Browser checks
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/ci-e2e.yml

  containers-checks:
    name: Container checks
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.containers-pr == 'true'
    uses: ./.github/workflows/ci-containers.yml

  # Required status checks are the repository's external interface. These
  # gates keep their names stable even though the implementation lives in
  # reusable workflows. Path-filtered lanes may be skipped on pull requests and
  # merge-group runs; push-to-main is always strict.
  rust-required:
    name: Rust
    if: always()
    needs: [changes, rust-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Rust checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_RESULT: ${{ needs.rust-checks.result }}
        run: bash scripts/ci/check-required-results.sh Rust "changed paths=$CHANGES_RESULT" "Rust checks=$RUST_RESULT"

  web-required:
    name: Web
    if: always()
    needs: [changes, web-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Web checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_RESULT: ${{ needs.web-checks.result }}
        run: bash scripts/ci/check-required-results.sh Web "changed paths=$CHANGES_RESULT" "Web checks=$WEB_RESULT"

  fallow-required:
    name: Fallow
    if: always()
    needs: [changes, web-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Fallow
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_RESULT: ${{ needs.web-checks.result }}
        run: bash scripts/ci/check-required-results.sh Fallow "changed paths=$CHANGES_RESULT" "Web checks=$WEB_RESULT"

  codegen-required:
    name: OpenAPI and Orval drift
    if: always()
    needs: [changes, codegen-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify codegen drift
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODEGEN_RESULT: ${{ needs.codegen-checks.result }}
        run: bash scripts/ci/check-required-results.sh "OpenAPI and Orval drift" "changed paths=$CHANGES_RESULT" "Codegen check=$CODEGEN_RESULT"

  e2e-required:
    name: E2E
    if: always()
    needs: [changes, integration-checks, e2e-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify E2E checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          INTEGRATION_RESULT: ${{ needs.integration-checks.result }}
          BROWSER_RESULT: ${{ needs.e2e-checks.result }}
        run: bash scripts/ci/check-required-results.sh E2E "changed paths=$CHANGES_RESULT" "Integration tests=$INTEGRATION_RESULT" "Browser tests=$BROWSER_RESULT"

  docker-required:
    name: Docker
    if: always()
    needs: [changes, containers-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify container builds
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTAINERS_RESULT: ${{ needs.containers-checks.result }}
        run: bash scripts/ci/check-required-results.sh Docker "changed paths=$CHANGES_RESULT" "Container builds=$CONTAINERS_RESULT"
