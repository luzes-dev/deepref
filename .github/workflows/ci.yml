name: CI

on:
  pull_request:
  push:
    branches: [development, staging, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  docs:
    name: Documentation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install documentation tooling
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Validate operations, acceptance, and links
        run: bash scripts/check-docs.sh

  rust:
    name: Rust / ${{ matrix.command }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        command: [fmt, clippy, test]
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.95.0
      - name: Set up sccache for compile-heavy checks
        if: matrix.command != 'fmt'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Enable sccache compiler wrapper
        if: matrix.command != 'fmt'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-1.95.0-${{ matrix.command }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.95.0-${{ matrix.command }}-
      - name: Run check
        env:
          COMMAND: ${{ matrix.command }}
        run: |
          case "$COMMAND" in
            fmt) cargo fmt --all -- --check ;;
            clippy) cargo clippy --workspace --all-targets --locked -- -D warnings ;;
            test) cargo test --workspace --all-targets --locked ;;
          esac
      - name: Show sccache statistics
        if: always() && matrix.command != 'fmt'
        run: ${SCCACHE_PATH:-sccache} --show-stats

  ai-pr15-gates:
    name: AI PR15 evaluation and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.95.0
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Enable sccache compiler wrapper
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Run checked-in gold-set evaluation gate
        run: cargo test -p deepref-ai --test eval_gate --locked
      - name: Run prompt-injection and security regressions
        run: cargo test -p deepref-ai --test prompt_injection_regressions --locked
      - name: Show sccache statistics
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm --filter @deepref/web test:unit -- --run
      - run: pnpm run build

  fallow:
    name: Fallow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted source with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gate new TypeScript quality issues
        env:
          FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm run quality:ts:audit

  codegen:
    name: OpenAPI and Orval drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Enable sccache compiler wrapper
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:api:check
      - name: Prove drift check left the tree clean
        run: git diff --exit-code
      - name: Show sccache statistics
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats

  full-stack:
    name: Full-stack integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Enable sccache compiler wrapper
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable dependencies
        run: docker compose -f infra/local/compose.yaml up -d --wait
      - name: Run integration tests
        run: |
          cargo run -q -p deepref-server -- migrate
          cargo test --workspace --tests --locked
      - name: Show sccache statistics
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats
      - name: Install Chromium
        run: pnpm --filter @deepref/web exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm --filter @deepref/web test:e2e
      - name: Stop disposable dependencies
        if: always()
        run: docker compose -f infra/local/compose.yaml down --volumes

  containers:
    name: Reproducible container build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up QEMU for multi-architecture push validation
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate and build every release target
        shell: bash
        run: |
          docker buildx bake --print
          bake_args=(
            --set '*.output=type=cacheonly'
            --set '*.cache-from=type=gha,scope=deepref-containers'
            --set '*.cache-to=type=gha,scope=deepref-containers,mode=max'
          )

          # Pull requests only need to prove that every image builds on the native
          # CI architecture. Pushes keep validating the full release platform set.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            bake_args+=(--set '*.platform=linux/amd64')
          fi

          docker buildx bake "${bake_args[@]}" api worker web

  rust-required:
    name: Rust
    if: always()
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify Rust checks
        env:
          RESULT: ${{ needs.rust.result }}
        run: test "$RESULT" = "success"

  e2e-required:
    name: E2E
    if: always()
    needs: full-stack
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify E2E checks
        env:
          RESULT: ${{ needs.full-stack.result }}
        run: test "$RESULT" = "success"

  docker-required:
    name: Docker
    if: always()
    needs: containers
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify container build
        env:
          RESULT: ${{ needs.containers.result }}
        run: test "$RESULT" = "success"
