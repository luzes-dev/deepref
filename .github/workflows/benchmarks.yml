name: Rust Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

concurrency:
  group: rust-benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  bench:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cargo-cache: save
          cargo-cache-key-prefix: bench-
          sccache: gha

      - name: Run Criterion benchmarks
        env:
          SQLX_OFFLINE: "true"
        run: |
          # --benches also selects libtest library/binary harnesses, which reject
          # Criterion's --save-baseline. Select only explicit benchmark targets.
          cargo bench --workspace --bench '*' --locked -- --save-baseline main

      - name: Archive Criterion benchmark reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-benchmarks-${{ github.sha }}
          path: target/criterion/
          retention-days: 30

  report-failure:
    if: always() && github.event_name == 'schedule' && needs.bench.result == 'failure'
    needs: bench
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
