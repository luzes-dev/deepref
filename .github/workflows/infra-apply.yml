name: Infrastructure Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Trusted environment root
        required: true
        type: choice
        options: [development, staging, production, global]
      source_ref:
        description: Full tested source commit SHA
        required: true
        type: string
      confirmation:
        description: Type APPLY
        required: true
        type: string

concurrency:
  group: infra-apply-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: sa-east-1
  TOFU_VERSION: 1.12.2

jobs:
  apply:
    name: Apply / ${{ inputs.environment }}
    if: inputs.confirmation == 'APPLY'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: infra-${{ inputs.environment }}-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require immutable source identity
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_ref must be a full commit SHA' >&2; exit 1; }
      - name: Checkout the approved source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - name: Verify source belongs to the trusted branch
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            development) branch=development ;;
            staging) branch=staging ;;
            production|global) branch=main ;;
          esac
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git fetch --no-tags origin "$branch"
          git merge-base --is-ancestor "$SOURCE_REF" "origin/$branch"
      - name: Assume protected apply role with OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}
          role-session-name: deepref-apply-${{ github.run_id }}
      - name: Install pinned OpenTofu
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip" \
            --output "$RUNNER_TEMP/tofu.zip"
          unzip -q "$RUNNER_TEMP/tofu.zip" -d "$RUNNER_TEMP/tofu"
          printf '%s\n' "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"
      - name: Plan and apply the reviewed identity
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          root="infra/environments/$ENVIRONMENT"
          tofu -chdir="$root" init -lockfile=readonly
          tofu -chdir="$root" plan -input=false -lock-timeout=5m -out="$RUNNER_TEMP/approved.tfplan"
          tofu -chdir="$root" apply -input=false -lock-timeout=5m "$RUNNER_TEMP/approved.tfplan"
          tofu -chdir="$root" plan -input=false -lock-timeout=5m -detailed-exitcode
