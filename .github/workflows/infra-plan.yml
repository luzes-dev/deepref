name: Infrastructure Plan

on:
  pull_request:
    branches: [development, staging, main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-plan.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment root to plan
        required: true
        type: choice
        options: [development, staging, production, global]

concurrency:
  group: infra-plan-${{ github.event.pull_request.number || inputs.environment || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: sa-east-1
  TOFU_VERSION: 1.12.2

jobs:
  static:
    name: OpenTofu static policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned OpenTofu and TFLint
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip" \
            --output "$RUNNER_TEMP/tofu.zip"
          unzip -q "$RUNNER_TEMP/tofu.zip" -d "$RUNNER_TEMP/tofu"
          install -m 0755 "$RUNNER_TEMP/tofu/tofu" "$RUNNER_TEMP/tofu-bin"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
          curl --fail --location --silent --show-error \
            https://github.com/terraform-linters/tflint/releases/download/v0.59.1/tflint_linux_amd64.zip \
            --output "$RUNNER_TEMP/tflint.zip"
          unzip -q "$RUNNER_TEMP/tflint.zip" -d "$RUNNER_TEMP/tflint"
          install -m 0755 "$RUNNER_TEMP/tflint/tflint" "$RUNNER_TEMP/tflint-bin"
      - name: Format, initialize, validate, and test every root
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tofu-bin" fmt -check -recursive infra
          "$RUNNER_TEMP/tflint-bin" --recursive --chdir=infra
          for kind in bootstrap environments; do
            for root in development staging production global; do
              directory="infra/$kind/$root"
              "$RUNNER_TEMP/tofu-bin" -chdir="$directory" init -backend=false -lockfile=readonly
              "$RUNNER_TEMP/tofu-bin" -chdir="$directory" validate
              "$RUNNER_TEMP/tofu-bin" -chdir="$directory" test
            done
          done

  speculative:
    name: Speculative plan / ${{ matrix.environment }}
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.environment) || '["development","staging","production","global"]') }}
    environment: infra-${{ matrix.environment }}-plan
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assume read-only planning role with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
          role-session-name: deepref-plan-${{ github.run_id }}
      - name: Install pinned OpenTofu
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip" \
            --output "$RUNNER_TEMP/tofu.zip"
          unzip -q "$RUNNER_TEMP/tofu.zip" -d "$RUNNER_TEMP/tofu"
          printf '%s\n' "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"
      - name: Plan without saving sensitive output
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          tofu -chdir="infra/environments/$ENVIRONMENT" init -lockfile=readonly
          tofu -chdir="infra/environments/$ENVIRONMENT" plan \
            -input=false -lock-timeout=5m -no-color
