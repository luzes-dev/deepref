name: Regenerate Orval client

on:
  push:
    branches:
      - dependabot/npm_and_yarn/development/orval-8.26.0

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 24.4.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate API artifacts
        run: pnpm generate:api
      - name: Commit generated artifacts and remove helper workflow
        run: |
          rm .github/workflows/regenerate-orval.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.json apps/web/src/lib/api/generated .github/workflows/regenerate-orval.yml
          git commit -m "chore: regenerate API client with Orval 8.26"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# helper activated from development
