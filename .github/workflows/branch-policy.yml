name: Branch Policy

on:
  pull_request:
    branches: [development, staging, main, gitops]
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: branch-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate trusted branch ladder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check source, target, and GitOps actor
        env:
          ACTOR: ${{ github.event.pull_request.user.login }}
          BASE_BRANCH: ${{ github.base_ref }}
          DEPLOYMENT_APP_SLUG: ${{ vars.DEPLOYMENT_APP_SLUG }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "Protected branch PRs must originate in this repository."
            exit 1
          fi

          case "$BASE_BRANCH" in
            development)
              case "$HEAD_BRANCH" in
                feat/*|feature/*|fix/*|bugfix/*|chore/*|docs/*|refactor/*|test/*|dependabot/*|main) ;;
                *) echo "Invalid source for development: $HEAD_BRANCH"; exit 1 ;;
              esac
              ;;
            staging)
              case "$HEAD_BRANCH" in
                development|main) ;;
                *) echo "Only development (or main hotfix back-merges) may target staging."; exit 1 ;;
              esac
              ;;
            main)
              case "$HEAD_BRANCH" in
                staging|hotfix/*) ;;
                *) echo "Only staging or hotfix/* may target main."; exit 1 ;;
              esac
              ;;
            gitops)
              case "$HEAD_BRANCH" in
                deploy/dev/*|deploy/staging/*|deploy/production/*|deploy/rollback/*) ;;
                *) echo "Only deployment GitHub App branches may target gitops."; exit 1 ;;
              esac
              if [ -z "$DEPLOYMENT_APP_SLUG" ] || [ "$ACTOR" != "${DEPLOYMENT_APP_SLUG}[bot]" ]; then
                echo "gitops PRs must be opened by ${DEPLOYMENT_APP_SLUG:-<configured-app>}[bot]."
                exit 1
              fi
              ;;
            *) echo "Unsupported protected target: $BASE_BRANCH"; exit 1 ;;
          esac

          echo "Accepted branch transition: $HEAD_BRANCH -> $BASE_BRANCH"
