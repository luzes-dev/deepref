name: Projector Rebuild

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to rebuild
        required: true
        type: choice
        options: [development, staging, production]
      mode:
        description: Start or stop the one-shot rebuild Job
        required: true
        type: choice
        options: [start, stop]
      run_id:
        description: Lowercase UUID for start, or STOP for stop
        required: true
        type: string
      confirmation:
        description: Type REBUILD to continue
        required: true
        type: string

concurrency:
  group: rebuild-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  propose:
    name: Propose constrained projector rebuild / ${{ inputs.environment }}
    if: inputs.confirmation == 'REBUILD'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rebuild-${{ inputs.environment }}
    steps:
      - name: Checkout trusted source automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source
          persist-credentials: false
          ref: development
      - name: Mint deployment App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout protected GitOps branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          path: gitops
          persist-credentials: false
          ref: gitops
          token: ${{ steps.app-token.outputs.token }}
      - name: Apply and validate the constrained values transition
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          python3 source/scripts/ci/update-gitops-rebuild-values.py \
            "gitops/environments/$ENVIRONMENT/values.yaml" "$MODE" "$RUN_ID"
          git -C gitops diff --check
          git -C gitops diff --binary > "$RUNNER_TEMP/rebuild-values.diff"
          source/scripts/ci/validate-gitops-values.sh --mode "$MODE" "$RUNNER_TEMP/rebuild-values.diff"
      - name: Open protected GitOps PR
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ENVIRONMENT: ${{ inputs.environment }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          cd gitops
          branch="deploy/rebuild/$ENVIRONMENT/${RUN_ID,,}"
          git switch -c "$branch"
          git add "environments/$ENVIRONMENT/values.yaml"
          git -c user.name="${APP_SLUG}[bot]" -c user.email="${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -m "rebuild($ENVIRONMENT): $MODE"
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          export GH_TOKEN="$APP_TOKEN"
          gh pr create --base gitops --head "$branch" \
            --title "rebuild($ENVIRONMENT): $MODE" \
            --body "App-authored, policy-constrained projector rebuild values change. Review the generated Job and stop it after completion."
