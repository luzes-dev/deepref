name: Reconcile restored redesign

on:
  push:
    branches: [feat/deepref-ui-redesign]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout restored redesign
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - name: Merge current main and resolve redesign seams
        shell: bash
        env:
          REDESIGN_SOURCE: 47cfbff731dcd97f6b232c14d8b2f76eb628dfbb
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ] && [ "$merge_status" -ne 1 ]; then
            exit "$merge_status"
          fi

          # Current main owns package/tooling versions. Reapply only the redesign's
          # visual-test scripts, accessibility dependency, and typography packages.
          git checkout --theirs apps/web/package.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('apps/web/package.json')
          data = json.loads(path.read_text())
          scripts = data['scripts']
          scripts['test:e2e'] = 'playwright test --project=e2e'
          scripts['test:visual'] = 'playwright test --config=playwright.visual.config.ts'
          scripts['test:visual:update'] = 'playwright test --config=playwright.visual.config.ts --update-snapshots'
          dev = data['devDependencies']
          dev.pop('@fontsource-variable/inter', None)
          dev['@axe-core/playwright'] = '^4.13.0'
          dev['@fontsource-variable/ibm-plex-sans'] = '^5.2.6'
          dev['@fontsource-variable/source-serif-4'] = '^5.2.5'
          data['devDependencies'] = dict(sorted(dev.items()))
          path.write_text(json.dumps(data, indent='\t') + '\n')
          PY

          # Current main owns protocol draft/domain behavior; the redesign owns the
          # presentation markup. Keep the current script and the redesign's rendered UI.
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          file = 'apps/web/src/lib/features/protocol/components/ProtocolEditor.svelte'
          current = subprocess.check_output(['git', 'show', f'origin/main:{file}'], text=True)
          redesign = subprocess.check_output(['git', 'show', f"{os.environ['REDESIGN_SOURCE']}:{file}"], text=True)
          current_script, marker, _ = current.partition('</script>')
          _, redesign_marker, redesign_tail = redesign.partition('</script>')
          if not marker or not redesign_marker:
              raise SystemExit('ProtocolEditor script boundary not found')
          current_script = current_script.replace(
              "\timport * as Card from '$lib/components/ui/card';\n",
              "\timport * as Card from '$lib/components/ui/card';\n\timport * as Empty from '$lib/components/ui/empty';\n",
              1,
          )
          anchor = "\timport Trash2Icon from '@lucide/svelte/icons/trash-2';\n"
          extra = (
              "\timport BookOpenIcon from '@lucide/svelte/icons/book-open';\n"
              "\timport CheckCircle2Icon from '@lucide/svelte/icons/circle-check';\n"
              "\timport LockKeyholeIcon from '@lucide/svelte/icons/lock-keyhole';\n"
              "\timport ListChecksIcon from '@lucide/svelte/icons/list-checks';\n"
          )
          if anchor not in current_script:
              raise SystemExit('ProtocolEditor icon import anchor not found')
          current_script = current_script.replace(anchor, anchor + extra, 1)
          Path(file).write_text(current_script + '</script>' + redesign_tail)
          PY

          # Regenerate the lockfile from the resolved current package graph.
          git checkout --theirs pnpm-lock.yaml
          pnpm install --lockfile-only --ignore-scripts

          git add apps/web/package.json apps/web/src/lib/features/protocol/components/ProtocolEditor.svelte pnpm-lock.yaml

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge conflicts remain:"
            echo "$unresolved"
            exit 1
          fi

          git commit -m "merge: reconcile restored redesign with current main"
          git push origin HEAD:feat/deepref-ui-redesign
