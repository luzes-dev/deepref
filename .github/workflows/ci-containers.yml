name: CI / Containers

on:
  workflow_call:

permissions:
  contents: read

jobs:
  amd64:
    name: linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release images on native amd64
        uses: ./.github/actions/reproducible-container-build
        with:
          platform: linux/amd64
          cache-arch: amd64

  arm64:
    name: linux/arm64
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release images on native arm64
        uses: ./.github/actions/reproducible-container-build
        with:
          platform: linux/arm64
          cache-arch: arm64
