name: CI / Rust

on:
  workflow_call:
    inputs:
      run-coverage:
        description: Run the main-branch coverage lane.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  checks:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        command: [fmt, clippy, test, doctest]
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Migration policy compares against the pull request base commit.
          fetch-depth: 0
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: ${{ matrix.command == 'fmt' && 'rustfmt' || matrix.command == 'clippy' && 'clippy' || '' }}
          cargo-cache: ${{ matrix.command == 'test' && 'save' || 'restore' }}
          sccache: ${{ matrix.command != 'fmt' && 'local-bundle' || 'none' }}
      - name: Install pinned cargo-nextest
        if: matrix.command == 'test'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.143
          checksum: true
          fallback: none
      # The fmt lane shares setup across independent policy probes.
      - name: Probe workspace boundaries
        if: matrix.command == 'fmt'
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check rust.boundaries
      - name: Probe xtask tests
        if: matrix.command == 'fmt'
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check rust.xtask-tests
      - name: Probe migration policy (report-only)
        if: matrix.command == 'fmt'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: python3 scripts/ci/diagnose.py run-check rust.migrations
      - name: Probe formatting
        if: matrix.command == 'fmt'
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check rust.fmt
      - name: Probe ${{ matrix.command }}
        if: matrix.command != 'fmt'
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check rust.${{ matrix.command }}
      # sccache runs against local disk storage shipped as ONE cache bundle per
      # run: the ghac backend stores one GitHub cache entry per compiled object,
      # blows past GitHub's save rate limit, and every concurrent writer loses
      # (observed 577/577 cache_write_errors with 0 stored objects). Only the
      # test lane persists the bundle because its lib/bins/examples coverage
      # warms every other rustc lane; clippy-driver and instrumented objects are
      # lane-local and stay cold.
      - name: Save sccache bundle
        if: always() && matrix.command == 'test'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: sccache-bundle-${{ runner.os }}-rust-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
      - name: Show sccache statistics
        if: always() && matrix.command != 'fmt'
        run: |
          {
            echo '```'
            "${SCCACHE_PATH:-sccache}" --show-stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-rust-${{ matrix.command }}
          path: target/ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  # Every matrix job uploads only its own probe results.  This small job merges
  # them, marks probes that never ran as blocked, and restores the strict lane
  # result that the probes deliberately relaxed with continue-on-error.
  gate:
    name: Gate Rust
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download diagnostic artifacts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-diagnostics-rust-*
          path: diagnostics-artifacts
          merge-multiple: true
      - name: Merge and gate Rust diagnostics
        run: |
          mkdir -p diagnostics-artifacts
          python3 scripts/ci/diagnose.py --output target/ci-diagnostics merge diagnostics-artifacts
          python3 scripts/ci/diagnose.py --output target/ci-diagnostics gate rust
      - name: Upload consolidated diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-rust
          path: target/ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Coverage
    if: inputs.run-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          cargo-cache: restore
          sccache: none
      - name: Install pinned coverage tools
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov@0.9.0,cargo-nextest@0.9.143
          checksum: true
          fallback: none
      # llvm-cov compiles with instrumentation, so every object is unique to
      # this lane: the shared bundle cannot warm it, and a compiler wrapper
      # would only cache objects that nothing else ever consumes.
      - name: Run Rust test coverage
        env:
          SQLX_OFFLINE: "true"
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov nextest --lcov --output-path target/llvm-cov/lcov.info --locked
          cargo llvm-cov report --summary-only
      - name: Retain coverage artifact for main risk analysis
        run: |
          mkdir -p coverage/rust
          cp target/llvm-cov/lcov.info coverage/rust/lcov.info
          git rev-parse HEAD > coverage/rust/revision.txt
      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage-${{ github.sha }}
          path: coverage/rust/
          retention-days: 14
