name: Finalize Orval update

on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'ci: finalize Orval dependency update'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout development
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - name: Refresh lockfile and install
        run: pnpm install --no-frozen-lockfile
      - name: Regenerate API artifacts
        run: pnpm generate:api
      - name: Verify web after regeneration
        run: |
          pnpm run lint
          pnpm run check
          pnpm --filter @deepref/web test:unit -- --run
          pnpm run build
      - name: Commit resolved update and remove helper
        run: |
          rm .github/workflows/finalize-orval.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml docs/openapi.json apps/web/src/lib/api/generated .github/workflows/finalize-orval.yml
          git commit -m "chore: regenerate API client with Orval 8.26"
          git push origin development
