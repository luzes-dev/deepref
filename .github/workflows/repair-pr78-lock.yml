name: Refresh PR 78 Cargo.lock

on:
  push:
    branches:
      - fix/brooks-audit-architecture

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/brooks-audit-architecture

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0

      - name: Refresh Cargo.lock
        run: cargo metadata --format-version 1 >/dev/null

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git commit -m "fix(ci): refresh Cargo.lock after metrics removal"
          git push origin HEAD:fix/brooks-audit-architecture
