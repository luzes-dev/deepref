name: Temporary event-listener lock refresh

on:
  push:
    branches: [fix/development-validation-20260829]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/development-validation-20260829
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Refresh event-listener and remove helper
        run: |
          cargo update -p event-listener --precise 5.4.2
          rm .github/workflows/_tmp-refresh-event-listener.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/_tmp-refresh-event-listener.yml
          git commit -m "chore: refresh event-listener lock entry"
          git push origin HEAD:fix/development-validation-20260829
