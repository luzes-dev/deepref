name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      security-workflow: ${{ steps.filter.outputs.security-workflow }}
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'services/**'
              - 'tools/**'
              - 'review-definitions/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.sqlx/**'
              - 'compose.yaml'
              - '.github/workflows/security.yml'
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/security.yml'
            security-workflow:
              - '.github/workflows/security.yml'

  codeql:
    name: CodeQL / ${{ matrix.language }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - name: Skip check (path filtering)
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.outputs.security-workflow != 'true' &&
          ((matrix.language == 'rust' && needs.changes.outputs.rust != 'true') ||
           (matrix.language == 'javascript-typescript' && needs.changes.outputs.web != 'true'))
        env:
          LANGUAGE: ${{ matrix.language }}
        run: echo "No relevant changes detected for CodeQL ${LANGUAGE}; skipping check."
      - name: Checkout trusted source
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.security-workflow == 'true' ||
          (matrix.language == 'rust' && needs.changes.outputs.rust == 'true') ||
          (matrix.language == 'javascript-typescript' && needs.changes.outputs.web == 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.security-workflow == 'true' ||
          (matrix.language == 'rust' && needs.changes.outputs.rust == 'true') ||
          (matrix.language == 'javascript-typescript' && needs.changes.outputs.web == 'true')
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
      - name: Analyze
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.security-workflow == 'true' ||
          (matrix.language == 'rust' && needs.changes.outputs.rust == 'true') ||
          (matrix.language == 'javascript-typescript' && needs.changes.outputs.web == 'true')
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Install pinned prebuilt dependency tools
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.13.4
          checksum: true
          fallback: none
      - run: cargo deny --locked check
      - run: cargo shear --deny-warnings
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  repository-policy:
    name: Workflow and shell policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require immutable action references with version comments
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          bad = []
          pattern = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)(?:\s+#\s*(\S.*))?$")
          for path in pathlib.Path(".github/workflows").glob("*.y*ml"):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  match = pattern.match(line)
                  if not match:
                      continue
                  action, comment = match.groups()
                  if action.startswith("./"):
                      continue
                  ref = action.rsplit("@", 1)[-1]
                  if not re.fullmatch(r"[0-9a-f]{40}", ref) or not comment:
                      bad.append(f"{path}:{number}: {line.strip()}")
          if bad:
              print("Every external action must use a 40-character SHA and version comment:", file=sys.stderr)
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
      - name: Run actionlint and ShellCheck
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -gt 0 ]; then shellcheck "${scripts[@]}"; fi
      - name: Audit workflow security with zizmor
        run: pipx run --spec zizmor==1.11.0 zizmor --pedantic .github/workflows

  security-required:
    name: Security
    if: always()
    needs: [codeql, dependencies, repository-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify security checks
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPS_RESULT: ${{ needs.dependencies.result }}
          POLICY_RESULT: ${{ needs.repository-policy.result }}
        run: |
          for result in "$CODEQL_RESULT" "$DEPS_RESULT" "$POLICY_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A substantive security check did not succeed (result: $result)"
              exit 1
            fi
          done
          echo "All substantive security checks passed or were intentionally skipped."
