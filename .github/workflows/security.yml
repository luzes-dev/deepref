name: Security

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Install pinned prebuilt cargo-deny
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none
      - run: cargo deny --locked check
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  repository-policy:
    name: Workflow and shell policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require immutable action references with version comments
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          bad = []
          pattern = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)(?:\s+#\s*(\S.*))?$")
          for path in pathlib.Path(".github/workflows").glob("*.y*ml"):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  match = pattern.match(line)
                  if not match:
                      continue
                  action, comment = match.groups()
                  if action.startswith("./"):
                      continue
                  ref = action.rsplit("@", 1)[-1]
                  if not re.fullmatch(r"[0-9a-f]{40}", ref) or not comment:
                      bad.append(f"{path}:{number}: {line.strip()}")
          if bad:
              print("Every external action must use a 40-character SHA and version comment:", file=sys.stderr)
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
      - name: Run actionlint and ShellCheck
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -gt 0 ]; then shellcheck "${scripts[@]}"; fi
      - name: Run workflow security analysis
        run: |
          pipx run --spec zizmor==1.11.0 zizmor --pedantic .github/workflows

  configuration:
    name: IaC and container configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_HELM_KUBE_VERSION: "1.30.0"
          TRIVY_HELM_VALUES: .github/trivy-helm-values.yaml
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: charts/deepref/tests/kyverno
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "1"
      - name: Upload configuration findings
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-config.sarif
