name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST / Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The engine is pinned by the multi-arch image digest. The community rule
      # packs are fetched anonymously at run time and are therefore mutable:
      # a new rule release can surface a finding without a workflow change, so
      # review Security job logs when a scan starts failing.
      - name: Probe Semgrep
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check security.semgrep
      - name: Gate SAST
        if: always()
        run: python3 scripts/ci/diagnose.py gate security-sast
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-security-sast
          path: target/ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cargo-cache: none
          sccache: none
      - name: Install pinned Rust dependency tools
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.13.4
          checksum: true
          fallback: none
      - name: Install OSV-Scanner
        env:
          OSV_SCANNER_VERSION: v2.7.0
          OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            --output "$RUNNER_TEMP/osv-scanner"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check
          install -m 0755 "$RUNNER_TEMP/osv-scanner" "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      # Each dependency policy probe runs even when a sibling fails.  The gate
      # below restores the strict result expected by the Security check.
      - name: Probe cargo-deny
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check security.cargo-deny
      - name: Probe cargo-shear
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check security.cargo-shear
      - name: Probe OSV-Scanner
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check security.osv
      - name: Probe pnpm audit
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check security.pnpm-audit
      - name: Gate dependency policy
        if: always()
        run: python3 scripts/ci/diagnose.py gate security-dependencies
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-security-dependencies
          path: target/ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret scanning / Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" \
            --directory "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Probe Git history
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check security.gitleaks
      - name: Gate secret scanning
        if: always()
        run: python3 scripts/ci/diagnose.py gate security-secrets
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-security-secrets
          path: target/ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  configuration-security:
    name: Configuration security / Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.76.0
          TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/trivy.tar.gz" \
            --directory "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Trivy's config scanner covers Dockerfiles and supported IaC formats.
      # It does not parse compose.yaml or docker-bake.hcl, so those are checked
      # by the compose validation probe below and by the reproducible container
      # build's `docker buildx bake --print`.
      - name: Probe Trivy configuration
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check security.trivy
      - name: Probe compose configuration
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check security.compose-config
      - name: Gate configuration security
        if: always()
        run: python3 scripts/ci/diagnose.py gate security-configuration
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-security-configuration
          path: target/ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  repository-policy:
    name: Workflow and shell policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe immutable action references
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check security.action-pins
      - name: Probe immutable action reference policy tests
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check security.action-pins-tests
      - name: Probe diagnostic runner tests
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check security.diagnostics-tests
      - name: Probe actionlint
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check security.actionlint
      - name: Probe ShellCheck
        continue-on-error: true
        run: python3 scripts/ci/diagnose.py run-check security.shellcheck
      - name: Gate repository policy
        if: always()
        run: python3 scripts/ci/diagnose.py gate security-policy
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-security-policy
          path: target/ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  security-required:
    name: Security
    if: always()
    needs: [semgrep, dependencies, secrets, configuration-security, repository-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download diagnostic artifacts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-diagnostics-security-*
          path: security-diagnostics-artifacts
      - name: Merge security diagnostics
        run: |
          mkdir -p security-diagnostics-artifacts
          python3 scripts/ci/diagnose.py --output ci-diagnostics-security merge security-diagnostics-artifacts
      - name: Publish security diagnostic summary
        if: always()
        run: |
          if test -f ci-diagnostics-security/report.md; then
            cat ci-diagnostics-security/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No security diagnostic artifacts were available for this run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload aggregate security diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-security
          path: ci-diagnostics-security
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify security checks
        env:
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          CONFIGURATION_RESULT: ${{ needs.configuration-security.result }}
          POLICY_RESULT: ${{ needs.repository-policy.result }}
        run: |
          bash scripts/ci/check-required-results.sh --strict Security \
            "SAST / Semgrep CE=$SEMGREP_RESULT" \
            "Dependency policy=$DEPENDENCIES_RESULT" \
            "Secret scanning / Gitleaks=$SECRETS_RESULT" \
            "Configuration security / Trivy=$CONFIGURATION_RESULT" \
            "Workflow and shell policy=$POLICY_RESULT"

  report-failure:
    if: always() && github.event_name == 'schedule' && needs.security-required.result == 'failure'
    needs: security-required
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
