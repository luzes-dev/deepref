name: Security

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          languages: ${{ matrix.language }}
      - name: Analyze
        uses: github/codeql-action/analyze@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and auditors
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
          cargo install --locked cargo-audit --version 0.22.0
          cargo install --locked cargo-deny --version 0.18.4
      - run: cargo audit --deny warnings
      - run: cargo deny --locked check
      - name: Set up pnpm
        uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v4.1.0
        with:
          version: 11.3.0
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  repository-policy:
    name: Workflow and shell policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require immutable action references with version comments
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          bad = []
          pattern = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)(?:\s+#\s*(\S.*))?$")
          for path in pathlib.Path(".github/workflows").glob("*.y*ml"):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  match = pattern.match(line)
                  if not match:
                      continue
                  action, comment = match.groups()
                  if action.startswith("./"):
                      continue
                  ref = action.rsplit("@", 1)[-1]
                  if not re.fullmatch(r"[0-9a-f]{40}", ref) or not comment:
                      bad.append(f"{path}:{number}: {line.strip()}")
          if bad:
              print("Every external action must use a 40-character SHA and version comment:", file=sys.stderr)
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
      - name: Run actionlint and ShellCheck
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -gt 0 ]; then shellcheck "${scripts[@]}"; fi
      - name: Run workflow security analysis
        run: |
          pipx run --spec zizmor==1.11.0 zizmor --pedantic .github/workflows

  configuration:
    name: IaC and container configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_HELM_KUBE_VERSION: "1.30.0"
          TRIVY_HELM_VALUES: .github/trivy-helm-values.yaml
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
