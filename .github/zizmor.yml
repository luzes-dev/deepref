rules:
  dangerous-triggers:
    ignore:
      # release.yml only consumes successful CI runs from development, verifies the source SHA,
      # fetches the trusted development branch, and proves the source is its ancestor before release work.
      - release.yml:3
  github-env:
    ignore:
      # The release workflow appends only GitHub's trusted RUNNER_TEMP directory to GITHUB_PATH.
      - release.yml:80
