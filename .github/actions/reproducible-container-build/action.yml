name: Reproducible container build
description: Build all release images natively with persistent BuildKit and Rust compiler caches.

inputs:
  platform:
    description: OCI platform to validate on this native runner.
    required: true
  cache-arch:
    description: Stable architecture suffix used to isolate BuildKit and sccache entries.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Buildx
      id: buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Restore Rust compiler cache mount
      id: rust-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: container-sccache
        key: container-sccache-${{ inputs.cache-arch }}-rust-1.95.0-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          container-sccache-${{ inputs.cache-arch }}-rust-1.95.0-${{ hashFiles('Cargo.lock') }}-
          container-sccache-${{ inputs.cache-arch }}-rust-1.95.0-

    - name: Inject Rust compiler cache into BuildKit
      uses: reproducible-containers/buildkit-cache-dance@5b81f4d29dc8397a7d341dba3aeecc7ec54d6361 # v3.3.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        cache-map: |
          {
            "container-sccache": {
              "target": "/sccache",
              "id": "deepref-sccache",
              "sharing": "locked"
            }
          }
        skip-extraction: ${{ steps.rust-cache.outputs.cache-hit }}

    - name: Validate Bake definition
      shell: bash
      env:
        DEEPREF_ATTESTATIONS: ${{ github.event_name != 'pull_request' }}
      run: docker buildx bake --print >/dev/null

    - name: Build every release target
      uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
      env:
        DEEPREF_ATTESTATIONS: ${{ github.event_name != 'pull_request' }}
      with:
        source: .
        builder: ${{ steps.buildx.outputs.name }}
        targets: api,worker,web
        set: |
          *.output=type=cacheonly
          *.platform=${{ inputs.platform }}
          api.cache-from=type=gha,scope=deepref-rust-${{ inputs.cache-arch }}
          api.cache-to=type=gha,scope=deepref-rust-${{ inputs.cache-arch }},mode=max
          worker.cache-from=type=gha,scope=deepref-rust-${{ inputs.cache-arch }}
          web.cache-from=type=gha,scope=deepref-web-${{ inputs.cache-arch }}
          web.cache-to=type=gha,scope=deepref-web-${{ inputs.cache-arch }},mode=max
