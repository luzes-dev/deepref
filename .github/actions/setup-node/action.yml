name: Set up Node.js
description: Install pnpm and Node.js with the dependency cache used by DeepRef CI.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "24.21.0"
  pnpm-version:
    description: pnpm version to install.
    required: false
    default: "11.3.0"
  cache:
    description: Restore the pnpm store cache.
    required: false
    default: "true"
  install:
    description: Run a frozen-lockfile dependency install.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile
