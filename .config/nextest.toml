# Deepref cargo-nextest configuration
# See: https://nexte.st/book/configuration.html

[profile.default]
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }

# Each DB-backed test clones a private database from a migrated template
# (see deepref-postgres::test_isolation), so test binaries no longer share
# state and need no concurrency caps between each other.
[test-groups]
# The review run tests insert a model route and then rely on it being the newest route for its
# profile, so they cannot run beside each other. Nextest runs every test in its own process, so
# the in-process mutex in that test binary does not serialize them.
review-routes = { max-threads = 1 }

# This group only budgets connections. A DB test holds one lease connection,
# one short-lived maintenance connection, and a lazily grown pool of at most
# 12 (screening: 20). Six at once stay under 20 + 5 x 12 + 6 + 6 = 92 of the
# stock Postgres max_connections = 100; the cap binds only above six cores.
postgres = { max-threads = 6 }

[[profile.default.overrides]]
filter = 'binary(review_runs)'
test-group = 'review-routes'

[[profile.default.overrides]]
filter = 'kind(test) and (package(deepref-postgres) or package(deepref-worker) or package(deepref-http-api))'
test-group = 'postgres'

[profile.ci]
retries = 1
slow-timeout = { period = "60s", terminate-after = 2 }
