# Deepref cargo-nextest configuration
# See: https://nexte.st/book/configuration.html

[profile.default]
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }

# Each DB-backed test clones a private database from a migrated template
# (see deepref-app::test_isolation, feature `test-support`), so tests
# share no rows and need no serial groups.
#
# This group only budgets connections. A DB test holds one lease connection,
# one short-lived maintenance connection, and a lazily grown pool of at most
# 20 per pool. Six tests at once need at most 6 x (20 + 2) connections.
# CI runs Postgres with max_connections=300 (compose keeps the stock 100);
# keep the six-thread ceiling inside the compose budget before raising it:
# 6 x 22 = 132 exceeds stock max_connections = 100.
[test-groups]
postgres = { max-threads = 6 }

[[profile.default.overrides]]
filter = 'kind(test) and (package(deepref-app) or package(deepref-worker) or package(deepref-http-api))'
test-group = 'postgres'

[profile.ci]
retries = 1
slow-timeout = { period = "60s", terminate-after = 2 }
