# Deepref cargo-nextest configuration
# See: https://nexte.st/book/configuration.html

[profile.default]
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }

# Each DB-backed test clones a private database from a migrated template
# (see deepref-postgres::test_isolation, feature `test-support`), so tests
# share no rows and need no serial groups.
#
# This group only budgets connections. A DB test holds one lease connection,
# one short-lived maintenance connection, and a lazily grown pool of at most
# 20 per pool. Four tests at once need at most 4 x (20 + 2) connections,
# plus one server-wide background reaper, leaving headroom under the stock
# Postgres max_connections = 100. Tests still run in parallel.
[test-groups]
postgres = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'kind(test) and (package(deepref-postgres) or package(deepref-worker) or package(deepref-http-api))'
test-group = 'postgres'

[profile.ci]
retries = 1
slow-timeout = { period = "60s", terminate-after = 2 }
