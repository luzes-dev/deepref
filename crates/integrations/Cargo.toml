[package]
name = "deepref-integrations"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
biblatex.workspace = true
chrono.workspace = true
csv.workspace = true
deepref-application.workspace = true
deepref-config.workspace = true
deepref-domain.workspace = true
quick-xml = "0.42"
reqwest = { workspace = true, features = ["multipart"] }
roxmltree.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
urlencoding.workspace = true
workos = "3.4.1"
# Checks access-token signatures against keys the adapter fetched itself.
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto"] }

[lints]
workspace = true

[package.metadata.deepref]
layer = "adapter"
