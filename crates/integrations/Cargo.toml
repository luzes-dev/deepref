[package]
name = "deepref-integrations"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-nats.workspace = true
futures.workspace = true
biblatex.workspace = true
base64.workspace = true
hmac = "0.13"
sha2.workspace = true
url.workspace = true
uuid.workspace = true
chrono.workspace = true
csv.workspace = true
deepref-application.workspace = true
deepref-config.workspace = true
deepref-domain.workspace = true
quick-xml = "0.42"
reqwest = { workspace = true, features = ["multipart"] }
roxmltree.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
urlencoding.workspace = true
workos = "3.4.1"
# Checks access-token signatures against keys the adapter fetched itself.
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto"] }
redis = { version = "1.8.0", default-features = false, features = ["script", "tokio-rustls-comp", "connection-manager"] }

[lints]
workspace = true

[features]
# Typed fixture control only; never enabled by a production dependency.
valkey-test-support = []

[package.metadata.deepref]
layer = "adapter"

[dev-dependencies]
axum.workspace = true
