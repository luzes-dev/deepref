name: deepref-local

services:
  postgres:
    # Migration 0016 installs vector, so the disposable runtime must provide it.
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deepref
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres --dbname deepref"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
    labels:
      dev.deepref.disposable: "true"
