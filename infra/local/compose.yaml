name: deepref-local

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deepref
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres --dbname deepref"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  nats:
    image: nats:2.11.8-alpine
    command:
      [
        "--jetstream",
        "--store_dir",
        "/data",
        "--http_port",
        "8222",
        "--name",
        "deepref-local",
      ]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  neo4j:
    image: neo4j:5.26.26-community
    environment:
      NEO4J_AUTH: neo4j/deepref-local
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell --username neo4j --password deepref-local 'RETURN 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
    labels:
      dev.deepref.disposable: "true"
  nats-data:
    labels:
      dev.deepref.disposable: "true"
  neo4j-data:
    labels:
      dev.deepref.disposable: "true"
