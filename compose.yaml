name: deepref-local

services:
  postgres:
    # Migration 0016 installs vector, so the disposable runtime must provide it.
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    # nextest caps the postgres test group at 6 threads; each DB-backed test may
    # open a pool of 20 plus 2 maintenance connections (6 x 22 = 132), so keep
    # the server above that ceiling. CI starts Postgres with the same flag.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deepref
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres --dbname deepref"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  nats:
    # Optional local JetStream transport: docker compose --profile messaging up -d nats
    # Then select WORK_TRANSPORT=jetstream and NATS_URL=nats://127.0.0.1:4222.
    image: nats@sha256:ecf677bae6a0ae7900bd3217be041c6614d5dcd2cae780000f9cd69462b36541
    profiles: ["messaging"]
    command: ["-js", "-sd", "/data"]
    mem_limit: 256m
    ports:
      - "127.0.0.1:${NATS_HOST_PORT:-4222}:4222"
    volumes:
      - nats-data:/data
    # The pinned image is scratch-based; application readiness verifies the
    # JetStream management API rather than relying on an absent shell/wget.

  grobid:
    # Optional enrichment for parsed PDFs (sections + references). Start with:
    #   docker compose --profile enrichment up -d grobid
    # then set GROBID_URL=http://127.0.0.1:8070 for the worker.
    image: grobid/grobid:0.9.1-crf
    profiles: ["enrichment"]
    init: true
    ulimits:
      core: 0
    mem_limit: 2g
    environment:
      # The JVM's container detection crashes on some cgroup v2 hosts; size the heap explicitly.
      JAVA_OPTS: "-XX:-UseContainerSupport -Xmx1536m"
    ports:
      - "127.0.0.1:${GROBID_HOST_PORT:-8070}:8070"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8070 && printf \"GET /api/isalive HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q true <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  nats-data:
    labels:
      dev.deepref.disposable: "true"
  postgres-data:
    labels:
      dev.deepref.disposable: "true"
