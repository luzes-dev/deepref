name: deepref-local

services:
  postgres:
    # Migration 0016 installs vector, so the disposable runtime must provide it.
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deepref
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres --dbname deepref"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  grobid:
    # Optional enrichment for parsed PDFs (sections + references). Start with:
    #   docker compose --profile enrichment up -d grobid
    # then set GROBID_URL=http://127.0.0.1:8070 for the worker.
    image: grobid/grobid:0.8.2-crf
    profiles: ["enrichment"]
    init: true
    ulimits:
      core: 0
    mem_limit: 2g
    environment:
      # The JVM's container detection crashes on some cgroup v2 hosts; size the heap explicitly.
      JAVA_OPTS: "-XX:-UseContainerSupport -Xmx1536m"
    ports:
      - "127.0.0.1:${GROBID_HOST_PORT:-8070}:8070"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8070 && printf \"GET /api/isalive HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q true <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
    labels:
      dev.deepref.disposable: "true"
